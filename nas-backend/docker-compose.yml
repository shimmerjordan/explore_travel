services:
  ejnas:
    build: .
    image: ejnas:latest
    container_name: ejnas
    restart: unless-stopped
    # High host port (left side) — change it freely if 48080 is taken on your NAS,
    # but NEVER to 80 / 443 / 8080: consumer ISPs block inbound traffic on those,
    # so a home/NAS deployment becomes unreachable from the internet. Sibling
    # services use the adjacent high ports (backend 48081, web display 48082).
    ports:
      - "48080:48080"
    volumes:
      # DEFAULT: a Docker NAMED volume — it inherits the image's nonroot-owned
      # /data, so the DB is writable with ZERO host setup (no chown needed).
      # Holds ej.db (all your vault ciphertext). Back it up with:
      #   docker run --rm -v ejnas_ejdata:/data -v "$PWD":/backup busybox \
      #     tar czf /backup/ejdata.tgz -C /data .
      - ejdata:/data
      # ── ALTERNATIVE: host bind mount (data visible at ./data, easy backup) ──
      # A bind mount does NOT inherit image ownership, so you MUST make ./data
      # writable by the container's nonroot UID first:
      #   mkdir -p data && sudo chown -R 65532:65532 data
      # then comment out `- ejdata:/data` above and use:
      #   - ./data:/data
      # (Local fs only — never NFS/SMB: SQLite WAL + POSIX locks are unreliable
      # on network mounts.)
    environment:
      # REQUIRED, >= 32 bytes. Generate once: `openssl rand -base64 48`.
      EJ_JWT_SECRET: "${EJ_JWT_SECRET:?set EJ_JWT_SECRET in a .env file}"
      EJ_LISTEN: "0.0.0.0:48080"
      EJ_DB_PATH: "/data/ej.db"
      # Exact origins of your deployed Flutter web build (comma-separated).
      EJ_CORS_ORIGINS: "${EJ_CORS_ORIGINS:-}"
      # Close registration after you've created your account.
      EJ_ALLOW_REGISTRATION: "${EJ_ALLOW_REGISTRATION:-true}"
      # Read proxy for private images / CORS-less hosts (off by default).
      EJ_PROXY_ENABLED: "${EJ_PROXY_ENABLED:-false}"
      EJ_PROXY_ALLOW_HOSTS: "${EJ_PROXY_ALLOW_HOSTS:-}"
      EJ_TOKEN_TTL_SECS: "${EJ_TOKEN_TTL_SECS:-3600}"

volumes:
  ejdata:
