# 一个容器里带两个常驻进程（web-front 48080 + ej-backend 48081）。
#
# 注意：数据目录的补建与旧布局迁移不是 program —— 它必须在两个服务启动前完成，
# 由 deploy/entrypoint.sh 以 root 跑完，再 exec 到这里，见那个脚本。
[supervisord]
nodaemon=true
user=root
pidfile=/run/supervisord.pid
# nodaemon 模式下 supervisord 自己已经往 stdout 打一份日志，这里再指 /dev/stdout
# 会变成两个 handler、每行重复一遍 —— 所以 logfile 丢到 /dev/null。两个子进程的
# 日志各自走 stdout_logfile 到容器 stdout，`docker compose logs` 照样看得全。
logfile=/dev/null
logfile_maxbytes=0

# 留一个 socket，方便 `docker exec ej-app supervisorctl status/restart <name>`
[unix_http_server]
file=/run/supervisor.sock

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

# 两个 program 各自降权到合并前的 UID：数据目录属主分开，前端被攻破也写不动
# 排行榜库。priority 只决定 spawn 先后，supervisord 不会等前一个进入 RUNNING
# 才起下一个 —— 两个服务互不依赖，谁先起来都不影响对方，容器 HEALTHCHECK 的
# start-period 覆盖了这段窗口。
#
# 环境变量刻意不在这里写死：容器 env（Dockerfile 的默认值、compose、docker run
# -e）会被 supervisord 传给子进程，所以现有的两套冒烟脚本靠 -e 覆盖端口/令牌
# 仍然有效。
[program:web-front]
command=/usr/local/bin/web-front
user=nonroot
directory=/app
priority=10
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

[program:backend]
command=/usr/local/bin/node server/server.js
user=node
directory=/app
priority=20
autorestart=true
startsecs=3
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
