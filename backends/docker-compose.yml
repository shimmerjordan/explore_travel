# ⚠️ 已被根目录的合并镜像取代（2026-09-05）。
# 现在 web-front 与 ej-backend 跑在**同一个容器**里（根 Dockerfile +
# deploy/supervisord.conf），部署用仓库根的 docker-compose.yml /
# docker-compose.ghcr.yml。对外端口没变（48080 / 48081）。
#
# 这个文件保留下来只为两件事：① 回退——合并镜像出问题时还能起回两个独立容器；
# ② 单独调试其中一个服务。日常部署别用它，两边同时起会抢端口。
#
# explore_journal backend — compose deployment.
#
#   基本用法（ECS 上直接暴露端口 / 前面自己套 Nginx）:
#     docker compose up -d
#
#   经 frp 暴露（ECS 无公网入方向 / 想复用现有 frps）:
#     先填好 deploy/frpc.toml，然后
#     docker compose --profile frp up -d
#
#   经 Cloudflare Tunnel 暴露（免公网 IP、自动 HTTPS/WSS）:
#     export TUNNEL_TOKEN=eyJ...   # cloudflared 面板生成的 token
#     docker compose --profile cloudflare up -d
#
# 三种方式可叠加。资源占用：服务本体常驻内存 ~40 MB，空闲 CPU ≈ 0。
#
# 端口：本服务固定用高端口 48081（兄弟服务 web-front 用 48080，它自己托管 web 产物，
# 没有单独的静态服务）。
# 家庭宽带运营商普遍封禁入方向的 80 / 443 / 8080，**别把这三个端口配回来**，
# 否则家里/NAS 部署时从公网完全连不上。宿主端口可用 EJ_BACKEND_PORT 覆盖。
# 注意 Cloudflare Tunnel 走的是出方向 443，不受入方向封禁影响 —— 家宽部署
# 想被公网访问，它是最省事的一条路。

services:
  backend:
    build: .
    image: explore-journal-backend:latest
    container_name: ej-backend
    restart: unless-stopped
    ports:
      # 左侧宿主端口可改（避开 80/443/8080）；右侧容器端口与 Dockerfile 的
      # PORT 默认值绑定，改右侧要同步改 PORT。
      - "${EJ_BACKEND_PORT:-48081}:48081"
    volumes:
      # 数据存哪 —— 一个变量两种模式（排行榜数据落在这里）：
      #   不设（默认）→ 解析成 `ej-data`，Docker 命名卷，零宿主配置。
      #   设成绝对路径 → bind mount，数据在你自己的目录里，例如
      #     EJ_BACKEND_DATA_PATH=/volume1/docker/ej-backend/data
      #     bind mount 不继承镜像里的所有权，首次启动前先授权（容器用户是
      #     node，UID 1000）：
      #       sudo mkdir -p /volume1/docker/ej-backend/data
      #       sudo chown -R 1000:1000 /volume1/docker/ej-backend/data
      #   本地文件系统限定，别指向 NFS/SMB（原子改名 + fsync 语义不可靠）。
      - "${EJ_BACKEND_DATA_PATH:-ej-data}:/data"
    environment:
      # 见 README.md「配置项」一节；不设 token 即公开可用。
      TRUST_PROXY: "1"
      LB_WRITE_TOKEN: "${LB_WRITE_TOKEN:-}"
      GROUP_TOKEN: "${GROUP_TOKEN:-}"
      LOG_LEVEL: info
    # 小实例友好：硬性内存上限，防止意外增长挤占同机其他服务。
    mem_limit: 256m
    cpus: 0.5
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

  # ── 可选：frpc 旁路容器（--profile frp）────────────────────────────
  frpc:
    image: snowdreamtech/frpc:0.61.1
    container_name: ej-frpc
    restart: unless-stopped
    profiles: [frp]
    network_mode: "service:backend" # 直接以 127.0.0.1:48081 访问后端
    volumes:
      - ./deploy/frpc.toml:/etc/frp/frpc.toml:ro

  # ── 可选：Cloudflare Tunnel 旁路容器（--profile cloudflare）────────
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: ej-cloudflared
    restart: unless-stopped
    profiles: [cloudflare]
    network_mode: "service:backend"
    command: tunnel --no-autoupdate run --token ${TUNNEL_TOKEN:-}

volumes:
  # 仅在默认（命名卷）模式下使用；EJ_BACKEND_DATA_PATH 指向宿主目录时它被忽略。
  # 真实卷名带 compose project 前缀，从本目录运行即 `backends_ej-data`。备份：
  #   docker run --rm -v backends_ej-data:/data -v "$PWD":/backup busybox \
  #     tar czf /backup/ej-backend-data.tgz -C /data .
  ej-data:
