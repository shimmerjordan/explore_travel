<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>登录完成</title>
</head>
<body>
  <p style="font-family: sans-serif; padding: 24px;">登录完成，正在返回应用…（可关闭此窗口）</p>
  <script>
    // OAuth callback page for flutter_web_auth_2 on web. The provider
    // (Microsoft login) redirects here with ?code=...; hand the full URL back
    // to the opener via BOTH channels the plugin listens on: postMessage
    // (fast path) and localStorage (fallback the plugin polls every second,
    // in case window.opener is gone — e.g. COOP severed the handle).
    (function () {
      var url = window.location.href;
      try {
        if (window.opener) {
          window.opener.postMessage({'flutter-web-auth-2': url},
              window.location.origin);
        }
      } catch (e) { /* opener may be cross-origin-isolated */ }
      try { localStorage.setItem('flutter-web-auth-2', url); } catch (e) {}
      window.close();
    })();
  </script>
</body>
</html>
