name: Build web → web-build branch

# On every push to main, build the integrated static site (promo landing at /,
# Flutter app at /app/) and publish the built output to the `web-build` branch.
# Vercel (or Cloudflare Pages) watches `web-build` and deploys it directly —
# NO build step on the host side, so the host never needs a Flutter SDK.
#
# Why a build branch instead of pushing via the platform CLI/token?
#   - Vercel's native Git integration gives you preview URLs, rollbacks and a
#     deploy dashboard for free, and you don't store a Vercel token in GitHub.
#   - `web-build` is a plain deployable artifact you can also serve from a NAS,
#     Nginx, or Cloudflare Pages with identical settings.

on:
  push:
    branches: [main]
    paths:
      - 'lib/**'
      - 'web/**'
      - 'website/**'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - 'scripts/build-site.sh'
      - '.github/workflows/deploy-web.yml'
  workflow_dispatch: {}

# Allow the default GITHUB_TOKEN to push the built output to `web-build`.
permissions:
  contents: write

# If two pushes land quickly, cancel the older build so `web-build` always
# reflects the newest commit.
concurrency:
  group: web-build
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.32.1' # keep in sync with your local Flutter
      - run: flutter pub get
      - run: bash scripts/build-site.sh # → ./dist  (landing at /, app at /app/)

      - name: Publish ./dist to web-build branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: web-build
          # Single-commit orphan branch: keeps the repo small (no history bloat
          # from committing build artifacts on every push).
          force_orphan: true
          commit_message: 'build: web from ${{ github.sha }}'
