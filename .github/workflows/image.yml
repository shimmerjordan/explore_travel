name: 应用镜像（GHCR）

# ════════════════════════════════════════════════════════════════════════
# 编译、验证并发布**合并后的单镜像**：一个容器同时跑
#   · web-front（Rust，48080）—— 单 admin 登录 + 加密配置保管 + 运维看板
#     + Flutter web 静态托管 + 只读 WebDAV 代理
#   · ej-backend（Node，48081）—— 社区排行榜 + 组队中继
# 由 supervisord 带起，两个进程各自降权到合并前的 UID（65532 / 1000）。
#
# 这条流水线取代了原先的 web-front.yml 与 backend.yml 两条。合并的理由是它们
# 本来就要一起发布、一起部署；分成两条的代价是两次 Flutter 构建、两个 manifest、
# 两次 pull，而且两边的版本可能对不上。
#
# 做什么：
#   1. cargo test（SSRF 的两个谓词、Argon2 与密钥域分离、配置密文信封、
#      路径穿越、限流分桶）+ npm test（后端单元/集成）
#   2. flutter analyze / test 门禁，然后构建一次 web 产物拷进
#      web-front/web-dist/ —— 它会被 COPY 进镜像。只构建一次，两个架构共用
#      （纯静态资源与架构无关）
#   3. 用与线上完全同一份根 Dockerfile 交叉编译出 amd64 与 arm64 两个镜像
#   4. 对两个镜像都跑**两套**既有冒烟：web-front 的完整 API 冒烟 +
#      后端的容器级 E2E。arm64 在 QEMU 下跑，并核对镜像架构确实是 arm64
#      （防止交叉编译静默产出宿主架构产物）
#   5. 把双架构 manifest 推到 GHCR
#   6. 把「镜像地址 + NAS 上怎么一键部署 + 数据迁移注意」写进运行摘要页
#
# 为什么是交叉编译而不是 QEMU 模拟编译：在 QEMU 下编译 Rust 单架构就要 40 分钟
# 以上（ring 还要现编 C 与汇编），交叉编译在原生速度下跑几分钟完事。见根 Dockerfile。
#
# PR 只验证不推送；只有 main 上的 push 才会发布 latest。
# ════════════════════════════════════════════════════════════════════════

# 触发源是合并前两条流水线的并集。Flutter 侧也在里面：web 产物被 COPY 进镜像，
# 改了 lib/ 或 pubspec 之后不重建镜像，镜像里带的就是旧前端。
on:
  push:
    branches: [main]
    paths: &paths
      - 'Dockerfile'
      - '.dockerignore'
      - 'deploy/**'
      - 'web-front/**'
      - 'backends/**'
      - 'lib/**'
      - 'web/**'
      # assets/ 与 pubspec 里声明打进 App 的那三个 docs 也是 Flutter 构建的输入。
      # 少了它们，只改字体/贴图/内置文档时镜像不会重建，镜像里带的还是旧前端，
      # 而且没有任何信号。
      - 'assets/**'
      - 'docs/leaderboard-server-api.md'
      - 'docs/self-host-server-deploy.md'
      - 'docs/self-host-client-config.md'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/actions/image-build-setup/**'
      - '.github/actions/flutter-setup/**'   # Flutter 版本钉在那里，改钉点要重建镜像
      - '.github/workflows/image.yml'
  pull_request:
    paths: *paths
  workflow_dispatch: {}

concurrency:
  group: app-image-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # 推 GHCR 需要

env:
  IMAGE: ghcr.io/${{ github.repository }}/app

jobs:
  build-verify-publish:
    name: 双架构编译 + 两套冒烟 + 推 GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── 两个服务各自的纯逻辑测试（都很快，先跑，省得白构建镜像）────────
      # SSRF 判定（回环/私网/链路本地/ULA/IPv4-mapped/元数据地址全拒）、
      # Argon2 校验与域分离、配置密文信封、路径穿越。
      - name: Rust 单元测试
        working-directory: web-front
        run: cargo test --locked

      # node 22 与镜像里的运行时同版本。后端零 npm 依赖，所以没有 install 步骤。
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 后端单元测试（node --test）
        working-directory: backends
        run: npm test

      # ── Flutter 门禁 + web 产物 ──────────────────────────────────────────
      # Flutter 版本钉在 .github/actions/flutter-setup 里（为什么必须钉、不能裸
      # stable 的那段 flutter_quill 事故记录也在那里），这里不再硬编码，
      # 连 pub get 也由它做。
      - uses: ./.github/actions/flutter-setup

      # 与 deploy-web.yml 同一对门禁：这份产物会被 COPY 进镜像推到 GHCR，NAS 上
      # 一次 `compose pull` 就拿到。flutter-check.yml 红了并不会拦住这里发布
      # （两条流水线互不等待），所以构建前自己拦一次。
      - name: flutter analyze
        run: flutter analyze --fatal-infos
      - name: flutter test
        run: flutter test

      # 只构建一次，两个架构共用。必须在 docker build 之前：Dockerfile 的
      # `COPY web-front/web-dist/ /web/` 不是可选的。
      - name: 构建 Flutter web 产物
        run: |
          set -euo pipefail
          flutter build web --release
          # 先清空再拷：残留的上一次产物会被一起打进镜像，而 Flutter 的文件名
          # 并非全都带内容哈希，旧文件不会被新文件覆盖掉。
          rm -rf web-front/web-dist
          mkdir -p web-front/web-dist
          cp -r build/web/. web-front/web-dist/
          # 产物必须全局可读：COPY 保留宿主权限位，0600 的文件在镜像里对
          # nonroot 不可读（见根 Dockerfile 里 /web 那段注释）。
          chmod -R a+rX web-front/web-dist
          echo "产物大小：$(du -sh web-front/web-dist | cut -f1)"
          test -f web-front/web-dist/index.html || {
            echo "::error::web-dist 里没有 index.html —— 镜像会退化成只有说明页"; exit 1; }

      # 模拟器 / 构建器 / 登录 / 标签规则这四步与服务无关，收在一个 composite 里。
      - name: 镜像构建前置
        id: meta
        uses: ./.github/actions/image-build-setup
        with:
          image: ${{ env.IMAGE }}
          qemu-platforms: arm64
          login: ${{ github.event_name != 'pull_request' }}

      # 先单架构 load 到本地 daemon，才能把容器真跑起来验。
      # 注意 context 是仓库根（合并后 Dockerfile 在根，要同时拿到 web-front/
      # 与 backends/ 两棵子树）；上下文体积由 .dockerignore 的白名单控制。
      - name: 编译 amd64（加载到本地）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ej-app:smoke-amd64
          cache-from: type=gha,scope=app-amd64
          cache-to: type=gha,scope=app-amd64,mode=max

      # 两套冒烟都指向同一个合并镜像。它们各自的 docker run 只挂 /data 并覆盖
      # 环境变量，entrypoint 会补建两个子目录 —— 所以脚本本身不用改，只需要
      # 让它们别再自己 build（web-front 那套默认就不 build，后端那套用
      # SKIP_BUILD=1）。
      - name: 冒烟验证 amd64 · web-front 完整 API
        working-directory: web-front
        run: IMAGE=ej-app:smoke-amd64 ./scripts/docker-smoke.sh

      - name: 冒烟验证 amd64 · 后端容器级 E2E
        working-directory: backends
        run: SKIP_BUILD=1 E2E_IMAGE=ej-app:smoke-amd64 ./scripts/docker-e2e.sh

      - name: 编译 arm64（加载到本地）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: ej-app:smoke-arm64
          cache-from: type=gha,scope=app-arm64
          cache-to: type=gha,scope=app-arm64,mode=max

      # arm64 也跑完整套，不只是启动探测：ring 有 aarch64 专用汇编、Argon2
      # 有架构相关实现路径、bundled SQLite 是交叉编译出来的 C 代码 —— 这些
      # 「能链接」不等于「算得对」，只有真正打一遍 API 才能发现。
      # 曾经这里降级成 LEVEL=boot，理由是 Argon2 在模拟下太慢；实测（qemu-aarch64
      # 跑同一个交叉编译产物）注册 0.115 s、单次 Argon2 验证 0.096 s，理由不成立。
      - name: 冒烟验证 arm64 · web-front 完整 API + 架构核对
        working-directory: web-front
        run: IMAGE=ej-app:smoke-arm64 PLATFORM=linux/arm64 ./scripts/docker-smoke.sh

      - name: 冒烟验证 arm64 · 后端容器级 E2E
        working-directory: backends
        run: SKIP_BUILD=1 E2E_IMAGE=ej-app:smoke-arm64 ./scripts/docker-e2e.sh

      # 合并镜像新增的一条：升级路径。合并前两个服务各自把 /data 当自己的根，
      # 现在分住 /data/web 与 /data/backend，entrypoint 要把旧布局搬过去。
      # 这一步造一份旧布局再启动，验证搬对了、重复启动不重复搬、目标已存在时
      # 不覆盖。**没有这条，用户升级时静默丢数据的风险没有任何拦阻。**
      - name: 验证旧数据布局的迁移
        run: |
          set -euo pipefail
          VOL=ej-mig-ci
          docker volume rm "$VOL" >/dev/null 2>&1 || true
          docker volume create "$VOL" >/dev/null
          docker run --rm -v "$VOL:/d" alpine sh -c '
            printf "{}" > /d/admin.json
            printf "{}" > /d/config.json
            printf "[{\"peerId\":\"pre-merge\"}]" > /d/leaderboard.json'
          docker run -d --name ej-mig-ci -v "$VOL:/data" ej-app:smoke-amd64 >/dev/null
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' ej-mig-ci)" = healthy ] && break
            sleep 1
          done
          docker logs ej-mig-ci 2>&1 | grep -q '发现合并前的数据布局' \
            || { echo "::error::迁移没有触发"; docker logs ej-mig-ci; exit 1; }
          docker exec ej-mig-ci test -f /data/web/admin.json
          docker exec ej-mig-ci test -f /data/backend/leaderboard.json
          docker exec ej-mig-ci sh -c 'grep -q pre-merge /data/backend/leaderboard.json' \
            || { echo "::error::迁移后内容不对"; exit 1; }
          # 重启不该再搬一次（判据是文件位置，不是标记文件，所以天然幂等）
          BEFORE=$(docker exec ej-mig-ci cat /data/backend/leaderboard.json)
          docker restart ej-mig-ci >/dev/null; sleep 6
          AFTER=$(docker exec ej-mig-ci cat /data/backend/leaderboard.json)
          [ "$BEFORE" = "$AFTER" ] || { echo "::error::重启后数据变了"; exit 1; }
          # 目标已存在时不覆盖，旧文件原地留着让人自己看
          docker exec ej-mig-ci sh -c 'printf "{}" > /data/leaderboard.json'
          docker restart ej-mig-ci >/dev/null; sleep 6
          docker logs ej-mig-ci 2>&1 | tail -20 | grep -q '跳过 leaderboard.json' \
            || { echo "::error::目标已存在时没有跳过，可能覆盖了数据"; exit 1; }
          docker rm -f ej-mig-ci >/dev/null
          docker volume rm "$VOL" >/dev/null
          echo "迁移、幂等、不覆盖 三项均通过"

      - name: 推送双架构 manifest
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=app-amd64
            type=gha,scope=app-arm64

      # 运行摘要页是点进一次运行后落地的地方。没有它就只是一片绿勾，
      # 看不出发布了什么、怎么部署。
      #
      # 缩进说明：下面所有内容都在块标量的基准缩进上，YAML 会把它剥掉，
      # heredoc 正文到达 shell 时在第 0 列 —— 这样 markdown 才不会被渲染
      # 成代码块。别给这些行重新加缩进。
      - name: 写入运行摘要
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          S="$GITHUB_STEP_SUMMARY"

          if [ "$JOB_STATUS" = success ]; then
            if [ "$IS_PR" = true ]; then
              echo "## ✅ 应用镜像验证通过（PR 不发布）" >> "$S"
            else
              echo "## ✅ 应用镜像已发布到 GHCR" >> "$S"
            fi
          else
            {
              echo "## ❌ 应用镜像流水线失败（状态：$JOB_STATUS）"
              echo ""
              echo "排查：展开上面失败的那一步；两套冒烟失败都会自动打印容器日志。"
              echo "本机复现："
              echo '```bash'
              echo "docker build -t ej-app:test ."
              echo "cd web-front && IMAGE=ej-app:test ./scripts/docker-smoke.sh"
              echo "cd backends && SKIP_BUILD=1 E2E_IMAGE=ej-app:test ./scripts/docker-e2e.sh"
              echo '```'
            } >> "$S"
          fi

          cat >> "$S" <<'HEADER'

          **发布对象**：一个镜像两个服务 —— `web-front`（Rust，48080：单 admin 登录 + 加密配置保管 + 运维看板 + Flutter web 静态托管 + 只读 WebDAV 代理）与 `ej-backend`（Node，48081：社区排行榜 + 组队中继），由 supervisord 带起，两个进程分别以 UID 65532 / 1000 运行，各自只写得动自己的数据目录。镜像里带着本次构建的 web 产物。

          HEADER

          {
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 架构 | \`linux/amd64\` + \`linux/arm64\`（同一个 manifest，pull 时自动选） |"
            echo "| 摘要 digest | \`${DIGEST:-—（PR 不推送）}\` |"
            echo "| 提交 | \`${GITHUB_SHA:0:7}\` |"
            echo "| 基础镜像 | \`node:22-bookworm-slim\` + supervisor |"
            echo "| 对外端口 | 48080（web）· 48081（backend） |"
          } >> "$S"

          if [ -n "$TAGS" ]; then
            {
              echo ""
              echo "**本次标签**"
              echo ""
              echo '```'
              echo "$TAGS"
              echo '```'
            } >> "$S"
          fi

          cat >> "$S" <<'VERIFIED'

          ### 本次验证了什么

          - **Rust 单元测试** —— SSRF 判定的两个谓词（请求侧拒私网、配置侧允私网但仍拒环回与云元数据）、Argon2 校验与密钥派生的域分离、配置密文信封、路径穿越（字面 / `%2f` / `%252f` 三种）、限流分桶与过期驱逐、指标路由白名单
          - **后端单元测试** —— 排行榜的规范化 JSON 与 Ed25519 验签（与 Dart 端逐字节对齐的测试向量）、限流、组队中继的房间与令牌
          - **web-front 完整 API 冒烟 · amd64 与 arm64 各一遍** —— 默认口令能登录且自报 `is_default_password` → 未鉴权时配置/指标/导出全部 401 → 配置往返字节一致 → 导出默认脱敏而 `secrets=1` 才出明文 → 看板页免 session 可取 → 无 web 产物时根路径给说明页、带扩展名的路径给 JSON 404 → **改密后用新口令仍能读出配置（验证重加密真的发生了）** → `docker restart` 后会话消失而口令与密文都还在 → 代理关闭时连功能存在都不暴露、打开后写动词 405 且穿越 403
          - **后端容器级 E2E · amd64 与 arm64 各一遍** —— 开放模式与令牌强制模式各跑一轮完整 API、数据正确性、中继、重启持久化
          - **升级路径** —— 造一份合并前的数据布局，验证首次启动把它搬进 `/data/web` 与 `/data/backend`、内容完好、重启不重复搬、目标已存在时不覆盖
          - **为什么 arm64 也要打全套** —— ring 有 aarch64 专用汇编、Argon2 有架构相关路径，「能链接」不等于「算得对」；同时核对镜像架构确为 `arm64`，防止交叉编译静默产出宿主架构的产物

          VERIFIED

          if [ "$IS_PR" = true ]; then
            cat >> "$S" <<'PRNOTE'
          ### 本次不发布

          PR 只做验证。合并到 `main` 后会自动推 `latest` 与 `sha-<7位>` 两个标签。

          PRNOTE
            exit 0
          fi

          cat >> "$S" <<HOWTO

          ### 从两个容器升级到这一个

          原先跑着 \`web-front\` 与 \`ej-backend\` 两个容器的话，按这个顺序换：

          \`\`\`bash
          # ① 先备份两份数据（迁移会移动文件，虽然是幂等的，但备份不要省）
          sudo tar czf ej-backup-\$(date +%F).tgz -C /volume1/docker/web-front/data . \\
                                                  -C /volume1/docker/ej-backend/data .

          # ② 停掉旧的两个
          sudo docker compose -f web-front/docker-compose.ghcr.yml down
          sudo docker compose -f backends/docker-compose.ghcr.yml down

          # ③ 把两份数据并到同一个目录下（保持各自原来的文件名，别建子目录 ——
          #    子目录由容器第一次启动时自己建，属主也由它设）
          sudo mkdir -p /volume1/docker/explore-journal/data
          sudo cp -a /volume1/docker/web-front/data/.  /volume1/docker/explore-journal/data/
          sudo cp -a /volume1/docker/ej-backend/data/. /volume1/docker/explore-journal/data/
          \`\`\`

          两份数据的文件名不冲突（web 侧是 \`admin.json\` / \`config.json\` / \`metrics.json\`，后端侧是 \`leaderboard.json\`），所以可以直接并到一个目录里。

          ### 在 NAS 上部署

          **① 建目录并写 compose**

          \`\`\`bash
          sudo mkdir -p /volume1/docker/explore-journal/data && cd /volume1/docker/explore-journal
          \`\`\`

          HOWTO

          {
            echo '```bash'
            echo "cat > docker-compose.yml <<'YAML'"
            cat docker-compose.ghcr.yml
            echo 'YAML'
            echo '```'
          } >> "$S"

          cat >> "$S" <<HOWTO2

          **② 指定数据位置**（没有任何必填的密钥）

          \`\`\`bash
          printf 'EJ_DATA_PATH=/volume1/docker/explore-journal/data\\n' > .env
          \`\`\`

          合并前需要手工 \`chown 65532\` 那一步**不用了**：entrypoint 每次启动都会把两个子目录的属主纠正过来，bind mount 也零配置可用。

          **③ 起服务并自检**

          \`\`\`bash
          sudo docker compose up -d
          curl localhost:48080/healthz          # → {"status":"ok"}
          curl localhost:48081/healthz          # → ok
          sudo docker compose logs | grep entrypoint   # 看数据目录与迁移结果
          \`\`\`

          **④ 立刻改掉默认口令**

          浏览器打开 \`http://<NAS>:48080/admin\`，用 \`admin\` / \`admin\` 登录——顶部会挂一条红色横幅，改密表单就内联在里面。**任何能连到这个端口的人都能用默认口令登录并读走你全部云凭据。**

          之后在手机 App 的 **备份 → 「Web 前端 · 配置推送」** 里把配置推上来，浏览器打开 \`http://<NAS>:48080/\` 就能看数据了。

          ### 之后的运维

          \`\`\`bash
          # 升级
          sudo docker compose pull && sudo docker compose up -d

          # 钉到本次这个版本（可复现、可回滚）
          echo 'EJ_APP_IMAGE=${IMAGE}:sha-${GITHUB_SHA:0:7}' >> .env && sudo docker compose up -d

          # 只重启其中一个服务（不动另一个）
          sudo docker exec ej-app supervisorctl -c /etc/supervisor/conf.d/supervisord.conf restart backend

          # 备份（两个子目录一起）
          sudo tar czf ej-backup-\$(date +%F).tgz -C /volume1/docker/explore-journal/data .

          # WebDAV 用户需要打开只读代理（浏览器无法直连 WebDAV）
          # 在 compose 的 environment 里加 EJ_PROXY_ENABLED: "1"
          \`\`\`

          ### 几个容易踩的点

          - **端口**：\`48080\` / \`48081\` 是刻意选的高端口。家宽运营商封 \`80\` / \`443\` / \`8080\` 的入方向，配到那三个上从公网连不上。
          - **数据别放网络盘**：\`EJ_DATA_PATH\` 必须指向 NAS 本地文件系统。落盘用「写临时文件 → fsync → 原子改名 → fsync 目录」，NFS/SMB 对这套语义不可靠。
          - **忘记 admin 口令 = 已存的配置永久读不出来**。配置是用口令派生的密钥加密的，没有恢复通道。出路是从手机端重推一份覆盖它。
          - **地理定位与 PWA 安装需要安全上下文**：用 \`http://<局域网IP>:48080\` 打开时浏览器不给这些能力。在 NAS 本机用 \`localhost\`，或前面套个带证书的反代。
          - **必须置于带超时的反代之后**：web 侧是 thread-per-request 的，8 个慢速连接就能把全部 worker 占死。反代需要**同时**有读超时与响应写超时（或做响应缓冲）。
          - **经反代暴露时两个 TRUST_PROXY 都要开**（\`EJ_TRUST_PROXY=1\` 与 \`TRUST_PROXY=1\`），否则两个服务的限流都按反代自己的 IP 分桶，等于没有限流。
          - **OneDrive 重定向 URI**：Azure 应用注册里要加 SPA 平台的 \`http://<NAS>:48080/auth.html\`。
          - **镜像可见性**：本仓库是公开的，经 Actions 用 \`GITHUB_TOKEN\` 推送的包会关联到仓库并随之公开，NAS 上**不需要** \`docker login\`。万一 \`pull\` 报 \`denied\`/\`unauthorized\`，说明那个包是 private，两条路：① NAS 上 \`docker login ghcr.io -u <你的用户名>\`，密码填带 \`read:packages\` 的 PAT；② 包页 → 齿轮 **Package settings** → **页面最底部的 Danger Zone** → **Change visibility**。注意公开后**不能再改回私有**。
          HOWTO2

      - name: 失败时打印容器日志
        if: failure()
        run: |
          docker ps -a
          for n in $(docker ps -aq); do
            echo "── $(docker inspect -f '{{.Name}}' "$n")"
            docker logs "$n" 2>&1 | tail -60
          done
