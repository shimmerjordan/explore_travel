name: Docker 后端编译

# ════════════════════════════════════════════════════════════════════════
# 编译并验证 backends/ 的生产 Docker 镜像 —— explore_journal 自建后端
# （社区排行榜 + 组队中继，零 npm 依赖）。
#
# 这条流水线做什么：
#   1. 跑单元测试（含与 Dart 端逐字节对齐的 canonical-JSON / Ed25519 向量）
#   2. 用与线上完全同一份 Dockerfile 编译生产镜像
#   3. 把镜像当生产环境跑起来（非 root + /data volume + HEALTHCHECK），
#      对着容器打完整的 API / 数据正确性 / WS 中继 / 重启持久化 E2E，
#      跑两轮：开放模式、令牌鉴权模式
#   4. 把双架构（amd64 + arm64）manifest 推到 GHCR
#   5. 把「镜像地址 + NAS/服务器上怎么一键部署」写进运行摘要页
#
# 验证用的是原生 amd64 镜像（跑真容器打完整 E2E）；arm64 只参与最后的
# manifest 构建——镜像里没有编译步骤，只有 COPY 和一次 mkdir/chown，跨架构
# 没有可失败的余地。需要在 arm64 上跑真容器验证的是 web-front（Rust 交叉
# 编译），那条流水线里做了。
#
# PR 只验证不推送；只有 main 上的 push 才会发布 latest。
#
# 注意：本文件名保持 backend.yml 不变（重命名会断掉历史运行记录的链接，
# 以及分支保护里按名字引用的必需检查项）。Actions 页显示的是上面的 name。
# ════════════════════════════════════════════════════════════════════════

on:
  push:
    branches: [main]
    paths:
      - 'backends/**'
      - '.github/actions/image-build-setup/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backends/**'
      - '.github/actions/image-build-setup/**'
      - '.github/workflows/backend.yml'
  workflow_dispatch: {}

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # 推 GHCR 需要

env:
  IMAGE: ghcr.io/${{ github.repository }}/ej-backend

jobs:
  test-and-docker-e2e:
    name: 编译镜像 + 容器级 E2E + 推 GHCR
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backends
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Unit + integration suite: canonical-JSON/Ed25519 cross-language
      # vector, leaderboard API behaviour (LWW/TOFU/token/persistence),
      # WS relay routing. Zero npm dependencies → no install step.
      - name: 单元测试（node --test）
        run: npm test

      # Build the production image and run the container-level E2E twice
      # (open mode + auth mode). This is the exact image an ECS deploy
      # would run, including non-root user, volume and healthcheck.
      - name: 编译生产镜像 + 容器级 E2E
        run: ./scripts/docker-e2e.sh

      # Size/id of what was just built — the one genuinely per-run fact worth
      # surfacing. Never fails the job: on a build failure the image simply
      # doesn't exist and the summary renders a dash.
      - name: 采集镜像信息
        id: img
        if: always()
        run: |
          SIZE=$(docker images --format '{{.Size}}' explore-journal-backend:e2e | head -1 || true)
          ID=$(docker images --format '{{.ID}}' explore-journal-backend:e2e | head -1 || true)
          echo "size=${SIZE:-—}" >> "$GITHUB_OUTPUT"
          echo "id=${ID:-—}" >> "$GITHUB_OUTPUT"

      # Publish only after the E2E above has actually passed on this commit —
      # nothing reaches GHCR that hasn't served real traffic in a container.
      # QEMU is here purely so the arm64 layer's mkdir/chown can execute.
      # 与 web-front 共用同一个前置 composite（模拟器/构建器/登录/标签规则）。
      # 构建与容器级 E2E 仍在上面各自做，理由见该 action 的注释。
      - name: 镜像构建前置
        id: meta
        uses: ./.github/actions/image-build-setup
        with:
          image: ${{ env.IMAGE }}
          qemu-platforms: arm64
          login: ${{ github.event_name != 'pull_request' }}

      - name: 推送双架构 manifest
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: backends
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ej-backend
          cache-to: type=gha,scope=ej-backend,mode=max

      # The run-summary page is where you land when you click a run. Without
      # this it's a wall of green ticks that says nothing about what was
      # built or how to deploy it.
      #
      # NOTE on indentation: everything below sits at the block scalar's base
      # indent, so YAML strips it and the heredoc body reaches the shell at
      # column 0 — which is what keeps the markdown from rendering as code
      # blocks. Don't re-indent these lines.
      - name: 写入运行摘要
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          IMG_SIZE: ${{ steps.img.outputs.size }}
          IMG_ID: ${{ steps.img.outputs.id }}
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          S="$GITHUB_STEP_SUMMARY"

          if [ "$JOB_STATUS" = success ]; then
            if [ "$IS_PR" = true ]; then
              echo "## ✅ Docker 后端验证通过（PR 不发布）" >> "$S"
            else
              echo "## ✅ Docker 后端镜像已发布到 GHCR" >> "$S"
            fi
          else
            {
              echo "## ❌ Docker 后端编译失败（状态：$JOB_STATUS）"
              echo ""
              echo "排查：展开上面失败的那一步看日志，容器日志见最后一步「失败时打印容器日志」。"
              echo "本机复现：\`cd backends && ./scripts/docker-e2e.sh\`（需要 docker + node ≥ 20）。"
            } >> "$S"
          fi

          cat >> "$S" <<'HEADER'

          **编译对象**：`backends/` —— explore_journal 自建后端（社区排行榜 + 组队中继），零 npm 依赖，镜像里只有 Node 运行时和约 1500 行 JS。

          HEADER

          {
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 镜像大小 | ${IMG_SIZE} |"
            echo "| 架构 | \`linux/amd64\` + \`linux/arm64\`（同一个 manifest，pull 时自动选） |"
            echo "| 摘要 digest | \`${DIGEST:-—（PR 不推送）}\` |"
            echo "| 基础镜像 | \`node:22-alpine\`（以非 root 用户 \`node\` 运行） |"
            echo "| 提交 | \`${GITHUB_SHA:0:7}\` |"
          } >> "$S"

          if [ -n "$TAGS" ]; then
            {
              echo ""
              echo "**本次标签**"
              echo ""
              echo '```'
              echo "$TAGS"
              echo '```'
            } >> "$S"
          fi

          cat >> "$S" <<'BODY'

          ### 本次验证了什么

          - **单元测试** —— 与 Dart 端逐字节对齐的 canonical-JSON / Ed25519 签名向量、排行榜 API 行为（LWW 合并 / TOFU 信任 / 令牌 / 落盘持久化）、WS 中继路由
          - **生产镜像编译** —— 与线上部署完全同一份 `Dockerfile`
          - **容器级 E2E · 第 1 轮「开放模式」** —— 全部 API、数据正确性、WS 中继，以及 `docker restart` 之后 volume 里的数据仍在
          - **容器级 E2E · 第 2 轮「鉴权模式」** —— `LB_WRITE_TOKEN` + `GROUP_TOKEN` 强制生效，未带令牌的写入被拒
          - **HEALTHCHECK** —— 容器能真的转为 `healthy`

          上面的镜像大小/E2E 跑的是原生 amd64 镜像。推到 GHCR 的是同一份 `Dockerfile` 构建的 amd64 + arm64 双架构 manifest。

          BODY

          if [ "$IS_PR" = true ]; then
            cat >> "$S" <<'PRNOTE'
          ### 本次不发布

          PR 只做验证。合并到 `main` 后会自动推 `latest` 与 `sha-<7位>` 两个标签。

          PRNOTE
          else

          cat >> "$S" <<HOWTO
          ### 在 NAS / 服务器上一键部署

          不需要源码、不需要在目标机器上编译。三步。数据默认落在宿主目录 \`/share/Web/ej_data/backend\`（QNAP 上共享文件夹 \`Web\` 的真实路径）；换别的机器就改下面 compose 里那一行挂载路径，群晖一般是 \`/volume1/docker/…\`。

          **① 建数据目录并授权**（跳过这步排行榜写不进去）

          \`\`\`bash
          sudo mkdir -p /share/Web/ej_data/backend
          sudo chown -R 1000:1000 /share/Web/ej_data/backend
          cd /share/Web/ej_data
          \`\`\`

          docker 会把不存在的挂载点自动建成 root 所有，而服务以 \`node\`（UID 1000）运行。注意兄弟服务 web-front 的 UID 是 **65532**，两个目录的 \`chown\` 值不一样。

          **② 写 compose 文件**（整段复制执行。**不需要 .env**——这份文件刻意不使用 \`\${变量}\`）

          HOWTO

          {
            echo '```bash'
            echo "cat > docker-compose.yml <<'YAML'"
            cat docker-compose.ghcr.yml
            echo 'YAML'
            echo '```'
          } >> "$S"

          cat >> "$S" <<HOWTO2

          **③ 填两个令牌，起服务**

          \`\`\`bash
          openssl rand -hex 24    # → 填进 compose 的 LB_WRITE_TOKEN
          openssl rand -hex 24    # → 填进 compose 的 GROUP_TOKEN
          sudo docker compose up -d
          curl localhost:48081/healthz          # → ok
          curl localhost:48081/api/status       # 模块状态 / 内存 / 在线人数
          \`\`\`

          两个令牌**留空就是公开可写 / 公开可连**（任何人都能往你的排行榜里写、往你的中继上挂）。填了就把同样的值填进 App：排行榜页「配置社区服务器」填 \`LB_WRITE_TOKEN\`，组队设置「中继令牌」填 \`GROUP_TOKEN\`。

          > **用图形界面部署？** QNAP Container Station / 群晖 Container Manager 里，把 ② 那段 YAML 整段粘进「创建应用程序」的 YAML 框就行（令牌先填好再粘）——这也是这份 compose 不用 \`\${变量}\` 的原因：那些 UI 不做插值，粘一份带变量的进去会以 \`invalid reference format\` 失败。但 ① 的 \`mkdir\` + \`chown\` 仍然要 SSH 跑一次。

          ### 只想跑一半

          两个模块相互独立。关掉的那个**不会被构造** —— 不注册路由、不开文件、不起定时器：

          \`\`\`yaml
          # 只要排行榜
          environment:
            EJ_MODULE_GROUP: "0"
          # /entries /monthly /index 正常；WebSocket 升级被拒

          # 只要组队中继
          environment:
            EJ_MODULE_LEADERBOARD: "0"
          # /group/v1/ws 正常；/entries /monthly /index 返回 404
          \`\`\`

          两个都关会**拒绝启动并以非零码退出**：带零个模块占着端口会通过所有健康检查，却对一切真实请求返回 404，那是最难定位的一类故障。值拼错时模块保持启用并告警 —— 「你想关的还在跑」比「你想要的悄悄没了」容易发现。启动日志与 \`/api/status\` 都会报告实际启用了哪些模块。

          ### 之后的运维

          \`\`\`bash
          # 升级
          sudo docker compose pull && sudo docker compose up -d

          # 钉到本次这个版本（可复现、可回滚）：把 compose 里 image 那行换成
          #   image: ${IMAGE}:sha-${GITHUB_SHA:0:7}
          # 再 sudo docker compose up -d

          # 备份（数据就在宿主目录里，直接打包）
          sudo tar czf ej-backend-backup-\$(date +%F).tgz -C /share/Web/ej_data/backend .
          \`\`\`

          数据默认就在挂载的那个宿主目录里，容器升级、删了重建都不受影响，NAS 自带的备份任务也能直接看到。不想在宿主上建目录、也不想操心权限的话，把 compose 里挂载的左边换成 \`ej-backend-data\`（文件末尾已声明好的 Docker 命名卷，零权限配置）——代价是数据只能用 \`docker run\` 导出，而且 \`docker compose down -v\` 会连数据一起删掉。两种方式都别指向 NFS/SMB。

          本仓库是公开的，经 Actions 用 \`GITHUB_TOKEN\` 推送的包会关联到仓库并随之公开 —— 实测 \`ej-backend\` 与 \`web-front\` 都能**匿名** \`docker pull\`，NAS 上**不需要** \`docker login\`。万一 \`pull\` 报 \`denied\`/\`unauthorized\`，说明包是 private：① NAS 上 \`docker login ghcr.io -u <你的用户名>\` + 带 \`read:packages\` 的 PAT；或 ② 包页 → 右侧齿轮 **Package settings** → **滚到最底部 Danger Zone** → **Change visibility**（公开后不可逆）。

          HOWTO2

          fi

          cat >> "$S" <<'BODY2'
          ### 本地开发与复现

          ```bash
          cd backends && npm start                  # 本地跑，不需要 Docker → http://127.0.0.1:48081
          cd backends && ./scripts/docker-e2e.sh    # 复现这条流水线；需要 docker + node ≥ 20，退出码 0 = 全过
          ```

          服务本体常驻内存约 40 MB，空闲 CPU ≈ 0（compose 已设 256 MB / 0.5 核上限）。

          ### 关键环境变量

          | 变量 | 默认 | 说明 |
          |---|---|---|
          | `PORT` / `HOST` | `48081` / `0.0.0.0` | 监听地址 |
          | `DATA_DIR` | `/data` | 排行榜持久化目录（compose 已挂 volume） |
          | `TRUST_PROXY` | 关 | `1` = 信任 `CF-Connecting-IP` / `X-Forwarded-For` 做限流分桶。**经 frp / Cloudflare 暴露时必须开**，否则所有用户共享同一个限流桶 |
          | `LB_WRITE_TOKEN` | 空 | 设了之后 `POST /entries` 需要 `Authorization: Bearer`；读接口始终公开 |
          | `GROUP_TOKEN` | 空 | 设了之后组队连接需带令牌（App 内「中继令牌」填同一个值） |
          | `LB_READS_PER_MIN` / `LB_WRITES_PER_MIN` | 60 / 10 | 每 IP 限流 |
          | `GROUP_MAX_ROOM_SIZE` | 32 | 单房间人数上限 |
          | `LOG_LEVEL` | `info` | trace / info / warn / error |

          完整清单见 `backends/README.md` 的「配置项（环境变量）」一节。

          ### 三种公网暴露方式（可叠加）

          | 方式 | 命令 | 适用 |
          |---|---|---|
          | 直接开端口 | `docker compose up -d` | 主机有公网 IP，安全组放行 48081/tcp |
          | frpc 旁路 | 填好 `deploy/frpc.toml` 后 `docker compose --profile frp up -d` | 无公网入方向，或想复用现有 frps |
          | Cloudflare Tunnel | `export TUNNEL_TOKEN=... && docker compose --profile cloudflare up -d` | **推荐**：免公网 IP，自动 HTTPS/WSS |

          `48081` 是刻意选的高端口 —— 家宽运营商封 `80` / `443` / `8080` 的入方向。Cloudflare Tunnel 走的是出方向，不受影响。
          BODY2

      - name: 失败时打印容器日志
        if: failure()
        run: docker ps -a && docker ps -aq --filter name=ej-e2e | head -1 | xargs -r docker logs | tail -100
