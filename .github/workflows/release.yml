# Release pipeline — manually triggered build of APK + IPA, attached to a
# GitHub Release. Designed to work zero-config: with no secrets defined,
# Android produces a debug-signed APK and iOS produces an unsigned IPA
# (suitable for sideloading via AltStore / Sideloadly / a jailbroken
# device). Adding the optional secrets listed below upgrades both to
# fully production-signed artifacts.
#
# Trigger UI: Actions tab → "Release (manual)" → Run workflow.
#
# Optional secrets:
#   ANDROID_KEYSTORE_BASE64   base64 of your .jks
#   ANDROID_KEYSTORE_PASSWORD store password
#   ANDROID_KEY_ALIAS         key alias
#   ANDROID_KEY_PASSWORD      key password
#
#   IOS_CERTIFICATE_BASE64    base64 of your .p12 distribution cert
#   IOS_CERTIFICATE_PASSWORD  password the .p12 was exported with
#   IOS_PROVISIONING_PROFILE_BASE64  base64 of your .mobileprovision
#   IOS_TEAM_ID               your Apple Team ID (10-char)
#   IOS_EXPORT_METHOD         app-store-connect | ad-hoc | development
#                             (default: development — safest for sideload)

name: Release (manual)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0). Will be created if missing.'
        required: true
        default: 'v0.0.0-dev'
      prerelease:
        description: 'Mark as pre-release?'
        type: boolean
        default: true
      build_android:
        description: 'Build Android APK?'
        type: boolean
        default: true
      build_ios:
        description: 'Build iOS IPA?'
        type: boolean
        default: true
      flutter_version:
        description: 'Flutter SDK version'
        required: true
        default: '3.32.0'

concurrency:
  # One release build at a time per tag — avoids racing artifact uploads.
  group: release-${{ github.event.inputs.tag }}
  cancel-in-progress: false

jobs:
  # ───────────────────────── Android ─────────────────────────
  android:
    if: ${{ github.event.inputs.build_android == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      apk_name: ${{ steps.find_apk.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ github.event.inputs.flutter_version }}
          channel: stable
          cache: true

      # If a release-signing keystore is provided as a secret, decode it
      # and write a `key.properties` that the Gradle config consumes.
      # Without these secrets the step writes nothing and Gradle falls
      # back to debug-signing — the APK still builds (fine for internal
      # QA, NOT submittable to the Play Store).
      #
      # We can't put `secrets.X != ''` directly in a step-level `if:` —
      # GitHub's expression parser refuses to resolve the `secrets`
      # context in that position. So we do the existence check INSIDE
      # the script: if the env var is empty, the step short-circuits
      # with a friendly log line.
      - name: Configure Android signing (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret — will build a debug-signed APK."
            exit 0
          fi
          mkdir -p android/app
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload.keystore
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASS
          keyPassword=$KEY_PASS
          keyAlias=$KEY_ALIAS
          storeFile=upload.keystore
          EOF
          echo "::notice::Upload keystore wired — release APK will be production-signed."

      - name: Pub get
        working-directory: .
        run: flutter pub get

      - name: Analyze (non-fatal)
        working-directory: .
        run: flutter analyze --no-fatal-infos || true

      - name: Build APK (universal)
        working-directory: .
        # Universal APK — one binary that contains armv7, arm64 AND
        # x86_64 native libs. Larger (~70-100 MB) but installs on EVERY
        # Android device without users having to pick the right ABI,
        # and SIDE-steps the "软件包与现有软件包存在冲突" issue you can
        # get when split-per-abi APKs end up signed with a different
        # debug key than a previously-installed split.
        #
        # If you later want per-ABI splits for the Play Store (smaller
        # downloads), use `--release --split-per-abi` from your local
        # machine — Play Console resolves split conflicts for you. CI
        # explicitly does NOT split because the artifacts here are for
        # sideloading, where one-APK-fits-all matters more than size.
        run: flutter build apk --release

      - name: Rename APK
        id: find_apk
        working-directory: .
        run: |
          set -euo pipefail
          ls -lah build/app/outputs/flutter-apk/
          TAG="${{ github.event.inputs.tag }}"
          # `flutter build apk` (no split) emits a single
          # app-release.apk under flutter-apk/. Rename for clarity.
          cp build/app/outputs/flutter-apk/app-release.apk \
             "explore_journal-${TAG}-android-universal.apk"
          ls -lah explore_journal-${TAG}-android-universal.apk
          echo "name=explore_journal-${TAG}-android" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: ./explore_journal-*-android-universal.apk
          if-no-files-found: error
          retention-days: 14

  # ─────────────────────────── iOS ───────────────────────────
  ios:
    if: ${{ github.event.inputs.build_ios == 'true' }}
    runs-on: macos-14
    timeout-minutes: 45
    outputs:
      ipa_name: ${{ steps.find_ipa.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ github.event.inputs.flutter_version }}
          channel: stable
          cache: true

      - name: Pub get + iOS pod install
        working-directory: .
        run: |
          flutter pub get
          cd ios && pod install --repo-update

      # We can't put `secrets.X != ''` directly in a step-level `if:` —
      # GitHub's expression parser rejects the `secrets` context in
      # that position. Solution: a single "detect" step turns the
      # secret-presence check into a normal step output. Every later
      # step gates on `steps.detect.outputs.signed`, which IS legal in
      # an `if:`.
      - name: Detect iOS signing assets
        id: detect
        env:
          CERT_B64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
        run: |
          if [ -n "${CERT_B64:-}" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::iOS signing secrets present — will build a signed IPA."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No IOS_CERTIFICATE_BASE64 — will build an unsigned IPA (sideload-only)."
          fi

      # Install cert into a temp keychain and drop the provisioning
      # profile into the standard Library/MobileDevice path so
      # `flutter build ipa` / xcodebuild can find them.
      - name: Install code-signing assets
        if: steps.detect.outputs.signed == 'true'
        env:
          CERT_B64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERT_PASS: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN=runner.keychain
          KEYCHAIN_PASS=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 7200 "$KEYCHAIN"

          echo "$CERT_B64" | base64 -d > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$CERT_PASS" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"
          rm cert.p12

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_B64" | base64 -d \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/build.mobileprovision"

      - name: Build IPA (unsigned)
        if: steps.detect.outputs.signed == 'false'
        working-directory: .
        # Produces build/ios/iphoneos/Runner.app (no signature). We zip
        # the .app inside a Payload/ tree so the result is .ipa-shaped
        # and sideloaders (AltStore, Sideloadly) can re-sign it on
        # install. The only legal way to ship an iOS build without an
        # Apple Developer cert in CI.
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign
          mkdir -p Payload
          cp -R build/ios/iphoneos/Runner.app Payload/
          TAG="${{ github.event.inputs.tag }}"
          zip -qr "explore_journal-${TAG}-ios-unsigned.ipa" Payload
          ls -lah explore_journal-${TAG}-ios-unsigned.ipa

      - name: Build IPA (signed)
        if: steps.detect.outputs.signed == 'true'
        working-directory: .
        env:
          EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD || 'development' }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
        run: |
          set -euo pipefail
          # Write an ExportOptions.plist that matches the secret's
          # method/team. Automatic signing keeps the workflow honest
          # about which cert + profile it's actually using.
          cat > /tmp/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>${EXPORT_METHOD}</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><false/>
          </dict></plist>
          EOF
          flutter build ipa --release --export-options-plist=/tmp/ExportOptions.plist
          TAG="${{ github.event.inputs.tag }}"
          # `flutter build ipa` emits exactly one .ipa under build/ios/ipa/.
          cp build/ios/ipa/*.ipa "explore_journal-${TAG}-ios.ipa"
          ls -lah explore_journal-${TAG}-ios.ipa

      - name: Locate IPA
        id: find_ipa
        working-directory: .
        run: |
          ls -lah explore_journal-*-ios*.ipa
          echo "name=explore_journal-${{ github.event.inputs.tag }}-ios" >> "$GITHUB_OUTPUT"

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ./explore_journal-*-ios*.ipa
          if-no-files-found: error
          retention-days: 14

  # ───────────────────── Publish GitHub Release ─────────────────────
  release:
    needs: [android, ios]
    # Run as long as at least one platform job succeeded; tolerate the
    # other being skipped (because the user unticked it) or failed
    # (so the user still gets the platform that did build).
    if: ${{ always() && (needs.android.result == 'success' || needs.ios.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Android APKs
        if: ${{ needs.android.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: artifacts

      - name: Download iOS IPA
        if: ${{ needs.ios.result == 'success' }}
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: artifacts

      - name: List artifacts
        run: ls -lah artifacts/

      - name: Compose release notes
        id: notes
        env:
          TAG: ${{ github.event.inputs.tag }}
          SHA: ${{ github.sha }}
          FLUTTER_VERSION: ${{ github.event.inputs.flutter_version }}
        # The notes are composed in bash by inspecting `artifacts/` —
        # NOT by re-reading the `secrets.*` context. Why: GitHub's
        # expression parser refuses to resolve `secrets` in many
        # contexts (the `run:` block included the body via ${{ }}
        # which IS such a context, causing the L200/L217-style
        # "Unrecognized named-value: secrets" parser error). Reading
        # filenames is a side-channel-free way to know the signing
        # state per artifact.
        run: |
          set -euo pipefail
          {
            echo "# Explore Journal ${TAG}"
            echo
            echo "Manually-built release. Artifacts attached below."
            echo

            if ls artifacts/explore_journal-*-android-universal.apk >/dev/null 2>&1; then
              echo "## Android"
              for f in artifacts/explore_journal-*-android-universal.apk; do
                bn=$(basename "$f")
                echo "- \`$bn\` — universal build, installs on every Android device (armv7 / arm64 / x86_64 all included)"
              done
              echo
              echo "_Signing: production if you configured \`ANDROID_KEYSTORE_BASE64\`, otherwise debug-signed._"
              echo
              echo "> **遇到「软件包与现有软件包存在冲突」？** 这是签名不一致导致的（之前装过本地 dev 版，这次是 CI 版 / 反之）。卸载旧版本后重新安装即可。后续要彻底避免，在仓库 Secrets 里配好 \`ANDROID_KEYSTORE_BASE64\` 等四个值，所有 CI 产物都会用同一个上传密钥签名。"
              echo
            fi

            if ls artifacts/explore_journal-*-ios*.ipa >/dev/null 2>&1; then
              echo "## iOS"
              for f in artifacts/explore_journal-*-ios*.ipa; do
                bn=$(basename "$f")
                echo "- \`$bn\`"
              done
              echo
              if ls artifacts/explore_journal-*-ios-unsigned.ipa >/dev/null 2>&1; then
                echo "_Unsigned build — install via AltStore / Sideloadly / TrollStore. NOT submittable to App Store as-is._"
              else
                echo "_Production-signed build. Check ExportOptions for the method (development / ad-hoc / app-store)._"
              fi
              echo
            fi

            echo "---"
            echo
            echo "Built from \`${SHA}\` on Flutter \`${FLUTTER_VERSION}\`."
            echo "See \`docs/publishing.md\` for store-submission guidance."
          } > /tmp/notes.md
          cat /tmp/notes.md

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag }}
          name: ${{ github.event.inputs.tag }}
          body_path: /tmp/notes.md
          prerelease: ${{ github.event.inputs.prerelease == 'true' }}
          # Append assets — re-runs of the same tag won't fail if files
          # already exist.
          fail_on_unmatched_files: false
          files: |
            artifacts/*.apk
            artifacts/*.ipa
