name: 测试

# ════════════════════════════════════════════════════════════════════════
# 全仓库唯一的测试定义：三种语言的门禁一次跑完。
#
#   · Flutter —— analyze --fatal-infos + 全量 flutter test（约 500 个）
#                + build web --release（dart2js 编译门禁，见下面那步的注释）
#   · Node    —— backends/ 的排行榜与组队中继（规范化 JSON、Ed25519 验签、限流）
#   · Rust    —— web-front/ 的 SSRF 谓词、Argon2 域分离、密文信封、路径穿越
#
# **这是唯一一条 push 会自动触发的流水线。** 发布侧（build.yml）只能手动触发：
# push 只回答「代码是好的吗」，发布回答「现在要发出去吗」，后者该由人决定。
#
# 同一份定义还通过 `workflow_call` 被 build.yml 当作第一个 job 调用，下游的
# 镜像 / 站点 / 发版包全部 `needs: test` —— 所以手动发布也绕不过门禁。收益两条：
#   ① 测试只定义一处。以前 4 条流水线里有 4 份 analyze + test 的复制，改一处漏三处。
#   ② 「测试红了就不发布」是真的依赖关系。跨 workflow 之间没有依赖，两条并行的
#      流水线互不等待 —— 以前 flutter-check 红了照样能把镜像推上 GHCR。
# 手动发布时测试会再跑一遍（push 上那次是「当时」的结论，发布要的是「此刻」的）。
#
# 触发用 paths-ignore 而不是 paths 白名单：门禁的安全方向是「拿不准就跑」。白名单
# 漏掉一个新目录 = 那部分代码静默地没有门禁；黑名单漏掉一个纯文档目录 = 白跑一次。
# ════════════════════════════════════════════════════════════════════════

on:
  push:
    branches: [main]
    paths-ignore: &docs_only
      - '**/*.md'
      - 'docs/**'
      - 'website/**'
      - 'LICENSE'
      - '.gitignore'
      - '.dockerignore'
  pull_request:
    paths-ignore: *docs_only
  workflow_call:
    inputs:
      flutter-version:
        description: 留空 = 用 .github/actions/flutter-setup 里的钉点（唯一钉点）
        type: string
        required: false
        default: ''
  workflow_dispatch: {}

concurrency:
  # push / PR：同一个 ref 上后来的取消先前的（连着推几次只留最后一次的结论）。
  # 其余情况（被 build.yml 调用、手动单跑）用 run_id 兜底，保证互不取消 ——
  # 一次发版跑到一半的门禁不该被随后的任何触发顶掉。
  #
  # 注意不能拿 `github.event_name == 'workflow_call'` 来判断「是不是被调用」：
  # 被调用时这里看到的是**调用方的** event（也就是 workflow_dispatch），
  # 永远不会等于 workflow_call。
  group: >-
    test-${{ github.ref }}-${{ github.event_name == 'push' && 'push'
      || github.event_name == 'pull_request' && 'pr'
      || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: analyze + flutter/node/rust test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # 先跑最便宜的：后端零 npm 依赖，装个 node 就能跑，十几秒出结果。
      # 快的排前面 = 常见错误更早失败，不用等 Flutter SDK 下载完。
      - uses: actions/setup-node@v4
        with:
          # 与镜像运行时同版本（根 Dockerfile 的 node:22-bookworm-slim）。
          node-version: 22

      - name: Node · backends 单元与集成测试
        working-directory: backends
        run: npm test

      # Flutter 版本钉在 .github/actions/flutter-setup 里（连 pub get 一起做）。
      # 只有手动发版会传 flutter-version 覆盖它，保证「查的」和「发的」是同一套 SDK。
      - uses: ./.github/actions/flutter-setup
        with:
          flutter-version: ${{ inputs.flutter-version }}

      # --fatal-infos：info 级别（多半是 lint 建议）也算失败。宁可门禁严一点，
      # 也别让「只是 info」慢慢攒成没人敢看的几百条。
      - name: Flutter · analyze
        run: flutter analyze --fatal-infos

      # expanded 逐条打印用例名：失败时能直接在日志里定位到是哪一个；默认的
      # compact 输出靠原地刷新一行，在 CI 日志里什么都看不见。
      # test/tool/gen_app_icon_test.dart 会往 build/ 下写几张 PNG，是预期行为。
      - name: Flutter · test
        run: flutter test --reporter expanded

      # dart2js 编译门禁。**这一步不是多余的**：`flutter test` 跑在 Dart VM 上，
      # 不经过 dart2js，web 端独有的编译失败它一个都看不见。
      # `.github/actions/flutter-setup` 里记的那次 flutter_quill 事故正是纯
      # dart2js 编译失败 —— analyze 与 test 全绿，web 编不出来。
      #
      # 合并前 deploy-web.yml 每次 push 都会编一次 web，等于顺带做了这个门禁；
      # 发布改成手动触发之后那份覆盖没了，所以必须显式补回自动侧，否则「web
      # 编不出来」要等到某次手动发布才发现。
      #
      # 只编不留产物：真正要发布的两份产物 base-href 不同，各自在 build.yml 的
      # image / site job 里重新编（`/` 与 `/app/`），这里编的那份用不上。
      - name: Flutter · build web（dart2js 编译门禁）
        run: flutter build web --release

      # Rust 放最后：ring 与 argon2 要现编，冷缓存下是这里最慢的一步。
      - name: Rust · web-front 单元测试
        working-directory: web-front
        run: cargo test --locked
