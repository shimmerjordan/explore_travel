name: web-front 镜像（GHCR）

# ════════════════════════════════════════════════════════════════════════
# 编译、验证并发布 web-front/ 的镜像：单 admin 登录 + 加密配置保管 + 运维看板
# + Flutter web 静态托管 + 只读 WebDAV 代理。Rust + distroless，NAS 上一键部署
# 的那个服务。
#
# 这条流水线做什么：
#   1. cargo test（SSRF 的两个谓词、Argon2 与密钥域分离、配置密文信封、
#      路径穿越、限流分桶）
#   2. 构建一次 Flutter web 产物拷进 web-front/web-dist/ —— 它会被 COPY 进镜像。
#      只构建一次，两个架构共用（纯静态资源与架构无关）
#   3. 用与线上完全同一份 Dockerfile 交叉编译出 amd64 与 arm64 两个镜像
#   4. 对两个镜像都打完整 API 冒烟（登录 / 未鉴权 401 / 配置往返 / 导出脱敏 /
#      改密后配置仍可读 / 重启持久化 / 代理的两种姿态），arm64 在 QEMU 下跑并
#      额外核对镜像架构确实是 arm64（防止交叉编译静默产出宿主架构产物）
#   5. 把双架构 manifest 推到 GHCR
#   6. 把「镜像地址 + NAS 上怎么一键部署」写进运行摘要页
#
# 为什么是交叉编译而不是 QEMU 模拟编译：在 QEMU 下编译 Rust 单架构就要 40 分钟
# 以上（ring 还要现编 C 与汇编），交叉编译在原生速度下跑几分钟完事。
# 见 web-front/Dockerfile。
#
# PR 只验证不推送；只有 main 上的 push 才会发布 latest。
# ════════════════════════════════════════════════════════════════════════

# 触发源包含 Flutter 侧：web 产物现在被 COPY 进这个镜像，所以改了 lib/ 或
# pubspec 之后不重建镜像，镜像里带的就是旧前端。
on:
  push:
    branches: [main]
    paths: &paths
      - 'web-front/**'
      - 'lib/**'
      - 'web/**'
      # assets/ 与 pubspec 里声明打进 App 的那三个 docs 也是 Flutter 构建的输入。
      # 少了它们，只改字体/贴图/内置文档时镜像不会重建，镜像里带的还是旧前端，
      # 而且没有任何信号。
      - 'assets/**'
      - 'docs/leaderboard-server-api.md'
      - 'docs/self-host.md'
      - 'pubspec.yaml'
      - 'pubspec.lock'
      - '.github/actions/image-build-setup/**'
      - '.github/workflows/web-front.yml'
  pull_request:
    paths: *paths
  workflow_dispatch: {}

concurrency:
  group: web-front-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write # 推 GHCR 需要

env:
  IMAGE: ghcr.io/${{ github.repository }}/web-front

jobs:
  build-verify-publish:
    name: 双架构编译 + 冒烟验证 + 推 GHCR
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # SSRF 判定（回环/私网/链路本地/ULA/IPv4-mapped/元数据地址全拒）、
      # Argon2 校验与域分离、配置密文信封、路径穿越 —— 都是纯逻辑，跑得很快。
      - name: Rust 单元测试
        working-directory: web-front
        run: cargo test --locked

      # Flutter 只构建一次，两个架构共用：web 产物是纯静态资源，与架构无关。
      # 放在这里（Rust 测试之后、镜像构建之前）是因为 docker build 的 context
      # 需要 web-dist/ 里已经有产物；Dockerfile 的 COPY 不是可选的。
      # flutter-version 必须钉住，不能只写 channel: stable。裸 stable 会取
      # 「当时最新」的 stable，于是这条流水线的红绿由上游发版时间决定，而不是由
      # 本仓库的提交决定 —— 实际发生过一次：stable 走到 3.44.8 时，Flutter 给
      # TextInputClient 加了 onFocusReceived，而 flutter_quill 11.5.0 是用
      # `implements TextInputClient` 接入的（implements 不继承默认实现体），
      # 于是少一个必须的 override，dart2js 直接编译失败。没有任何一次提交碰过
      # 这里，构建却自己坏了。
      # 版本与 deploy-web.yml、本地开发环境保持一致；升级 Flutter 是一次独立的、
      # 需要连 flutter_quill 一起动的改动，不该由 CI 悄悄替我们决定什么时候做。
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.32.1' # 与 deploy-web.yml / 本地一致
          cache: true
      - name: 构建 Flutter web 产物
        run: |
          set -euo pipefail
          flutter pub get
          flutter build web --release
          # 先清空再拷：残留的上一次产物会被一起打进镜像，而 Flutter 的文件名
          # 并非全都带内容哈希，旧文件不会被新文件覆盖掉。
          rm -rf web-front/web-dist
          mkdir -p web-front/web-dist
          cp -r build/web/. web-front/web-dist/
          # 产物必须全局可读：COPY 保留宿主权限位，0600 的文件在镜像里对
          # nonroot 不可读（见 Dockerfile 里 /web 那段注释）。
          chmod -R a+rX web-front/web-dist
          echo "产物大小：$(du -sh web-front/web-dist | cut -f1)"
          test -f web-front/web-dist/index.html || {
            echo "::error::web-dist 里没有 index.html —— 镜像会退化成只有说明页"; exit 1; }

      # 模拟器 / 构建器 / 登录 / 标签规则这四步与服务无关，两条镜像流水线共用
      # 同一个 composite。构建与冒烟仍留在下面，见该 action 里为什么不把 push
      # 一起收进去。
      - name: 镜像构建前置
        id: meta
        uses: ./.github/actions/image-build-setup
        with:
          image: ${{ env.IMAGE }}
          qemu-platforms: arm64
          login: ${{ github.event_name != 'pull_request' }}

      # 先单架构 load 到本地 daemon，才能把容器真跑起来验。
      - name: 编译 amd64（加载到本地）
        uses: docker/build-push-action@v6
        with:
          context: web-front
          platforms: linux/amd64
          load: true
          tags: web-front:smoke-amd64
          cache-from: type=gha,scope=web-front-amd64
          cache-to: type=gha,scope=web-front-amd64,mode=max

      - name: 冒烟验证 amd64（完整 API）
        working-directory: web-front
        run: IMAGE=web-front:smoke-amd64 ./scripts/docker-smoke.sh

      - name: 编译 arm64（加载到本地）
        uses: docker/build-push-action@v6
        with:
          context: web-front
          platforms: linux/arm64
          load: true
          tags: web-front:smoke-arm64
          cache-from: type=gha,scope=web-front-arm64
          cache-to: type=gha,scope=web-front-arm64,mode=max

      # arm64 也跑完整 API，不只是启动探测：ring 有 aarch64 专用汇编、Argon2
      # 有架构相关实现路径、bundled SQLite 是交叉编译出来的 C 代码 —— 这些
      # 「能链接」不等于「算得对」，只有真正打一遍 API 才能发现。
      # 曾经这里降级成 LEVEL=boot，理由是 Argon2 在模拟下太慢；实测（qemu-aarch64
      # 跑同一个交叉编译产物）注册 0.115 s、单次 Argon2 验证 0.096 s，理由不成立。
      - name: 冒烟验证 arm64（QEMU 下完整 API + 架构核对）
        working-directory: web-front
        run: IMAGE=web-front:smoke-arm64 PLATFORM=linux/arm64 ./scripts/docker-smoke.sh

      - name: 推送双架构 manifest
        id: push
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: web-front
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=web-front-amd64
            type=gha,scope=web-front-arm64

      # 运行摘要页是点进一次运行后落地的地方。没有它就只是一片绿勾，
      # 看不出发布了什么、怎么部署。
      #
      # 缩进说明：下面所有内容都在块标量的基准缩进上，YAML 会把它剥掉，
      # heredoc 正文到达 shell 时在第 0 列 —— 这样 markdown 才不会被渲染
      # 成代码块。别给这些行重新加缩进。
      - name: 写入运行摘要
        if: always()
        working-directory: web-front
        env:
          JOB_STATUS: ${{ job.status }}
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          S="$GITHUB_STEP_SUMMARY"

          if [ "$JOB_STATUS" = success ]; then
            if [ "$IS_PR" = true ]; then
              echo "## ✅ web-front 镜像验证通过（PR 不发布）" >> "$S"
            else
              echo "## ✅ web-front 镜像已发布到 GHCR" >> "$S"
            fi
          else
            {
              echo "## ❌ web-front 镜像流水线失败（状态：$JOB_STATUS）"
              echo ""
              echo "排查：展开上面失败的那一步；冒烟失败会自动打印容器最后 30 行日志。"
              echo "本机复现：\`cd web-front && BUILD=1 ./scripts/docker-smoke.sh\`（需要 docker）。"
            } >> "$S"
          fi

          cat >> "$S" <<'HEADER'

          **发布对象**：`web-front/` —— 单 admin 登录 + 加密配置保管 + 运维看板 + Flutter web 静态托管 + 只读 WebDAV 代理。Rust 编译进 distroless 镜像，以非 root（UID 65532）运行，无 shell，镜像里带着本次构建的 web 产物。

          HEADER

          {
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 架构 | \`linux/amd64\` + \`linux/arm64\`（同一个 manifest，pull 时自动选） |"
            echo "| 摘要 digest | \`${DIGEST:-—（PR 不推送）}\` |"
            echo "| 提交 | \`${GITHUB_SHA:0:7}\` |"
            echo "| 基础镜像 | \`gcr.io/distroless/cc-debian12:nonroot\` |"
          } >> "$S"

          if [ -n "$TAGS" ]; then
            {
              echo ""
              echo "**本次标签**"
              echo ""
              echo '```'
              echo "$TAGS"
              echo '```'
            } >> "$S"
          fi

          cat >> "$S" <<'VERIFIED'

          ### 本次验证了什么

          - **单元测试** —— SSRF 判定的两个谓词（请求侧拒私网、配置侧允私网但仍拒环回与云元数据）、Argon2 校验与密钥派生的域分离、配置密文信封、路径穿越（字面 / `%2f` / `%252f` 三种）、限流分桶与过期驱逐、指标路由白名单
          - **完整 API 冒烟 · amd64 与 arm64 各一遍** —— 默认口令 `admin`/`admin` 能登录且自报 `is_default_password` → 未鉴权时配置/指标/导出全部 401 → 配置往返字节一致 → 导出默认脱敏而 `secrets=1` 才出明文 → 看板页免 session 可取 → 无 web 产物时根路径给说明页、带扩展名的路径给 JSON 404 → **改密后用新口令仍能读出配置（验证重加密真的发生了）** → `docker restart` 后会话消失而口令与密文都还在 → 代理关闭时连功能存在都不暴露、打开后写动词 405 且穿越 403
          - **为什么 arm64 也要打全套** —— ring 有 aarch64 专用汇编、Argon2 有架构相关路径，「能链接」不等于「算得对」；同时核对镜像架构确为 `arm64`，防止交叉编译静默产出宿主架构的产物

          VERIFIED

          if [ "$IS_PR" = true ]; then
            cat >> "$S" <<'PRNOTE'
          ### 本次不发布

          PR 只做验证。合并到 `main` 后会自动推 `latest` 与 `sha-<7位>` 两个标签。

          PRNOTE
            exit 0
          fi

          cat >> "$S" <<HOWTO

          ### 在 NAS 上部署

          四步。数据默认落在宿主目录 \`/share/Web/ej_data/front\`（三个小文件：口令哈希、配置密文、指标）——那是 QNAP 上共享文件夹 \`Web\` 的真实路径。换别的机器要改下面 compose 里那一行挂载路径：群晖一般是 \`/volume1/docker/…\`。

          **① 建数据目录并授权**（跳过这步容器一定起不来）

          \`\`\`bash
          sudo mkdir -p /share/Web/ej_data/front
          sudo chown -R 65532:65532 /share/Web/ej_data/front
          cd /share/Web/ej_data
          \`\`\`

          docker 会把不存在的挂载点自动建成 root 所有，而服务以 nonroot（UID 65532）运行 —— 不 \`chown\` 的话第一行日志就是 \`admin file error\`。

          **② 写 compose 文件**（整段复制执行。**不需要 .env、没有任何必填密钥**——这份文件刻意不使用 \`\${变量}\`）

          HOWTO

          {
            echo '```bash'
            echo "cat > docker-compose.yml <<'YAML'"
            cat docker-compose.ghcr.yml
            echo 'YAML'
            echo '```'
          } >> "$S"

          cat >> "$S" <<HOWTO2

          **③ 起服务并自检**（**没有 .env、没有任何必填的密钥**——早先那个必填的 JWT secret 已经不存在了）

          \`\`\`bash
          sudo docker compose up -d
          curl localhost:48080/healthz          # → {"status":"ok"}
          \`\`\`

          **④ 立刻改掉默认口令**

          浏览器打开 \`http://<NAS>:48080/admin\`，用 \`admin\` / \`admin\` 登录——顶部会挂一条红色横幅，改密表单就内联在里面。**任何能连到这个端口的人都能用默认口令登录并读走你全部云凭据。**

          之后在手机 App 的 **备份 → 「Web 前端 · 配置推送」** 里把配置推上来，浏览器打开 \`http://<NAS>:48080/\` 就能看数据了。

          > **用图形界面部署？** QNAP Container Station / 群晖 Container Manager 里，把 ② 那段 YAML 整段粘进「创建应用程序」的 YAML 框就行——这也是这份 compose 刻意不用 \`\${变量}\` 的原因：那些 UI 不做插值，粘一份带变量的进去会直接以 \`invalid reference format\` 失败。但 ① 的 \`mkdir\` + \`chown\` 仍然要 SSH 跑一次。

          ### 之后的运维

          \`\`\`bash
          # 升级到最新镜像
          sudo docker compose pull && sudo docker compose up -d

          # 钉到本次这个版本（可复现、可回滚）：把 compose 里 image 那行换成
          #   image: ${IMAGE}:sha-${GITHUB_SHA:0:7}
          # 再 sudo docker compose up -d

          # 备份（数据就在宿主目录里，直接打包那三个小文件）
          sudo tar czf web-front-backup-\$(date +%F).tgz -C /share/Web/ej_data/front .

          # WebDAV 用户需要打开只读代理（浏览器无法直连 WebDAV）
          # 把 compose 里的 EJ_PROXY_ENABLED 改成 "1"，再 up -d
          \`\`\`

          ### 几个容易踩的点

          - **端口**：\`48080\` 是刻意选的高端口。家宽运营商封 \`80\` / \`443\` / \`8080\` 的入方向，配到那三个上从公网连不上。同项目另一个服务 ej-backend 用 \`48081\`、数据目录 \`/share/Web/ej_data/backend\` —— 注意它以 \`node\`（UID **1000**）运行，\`chown\` 的 UID 与这里不同。
          - **数据别放网络盘**：挂载的宿主路径必须在 NAS 本地文件系统上。落盘用「写临时文件 → fsync → 原子改名 → fsync 目录」，NFS/SMB 对这套语义不可靠。
          - **忘记 admin 口令 = 已存的配置永久读不出来**。配置是用口令派生的密钥加密的，没有恢复通道。出路是从手机端重推一份覆盖它。
          - **镜像可见性**：本仓库是公开的，经 Actions 用 \`GITHUB_TOKEN\` 推送的包会关联到仓库并随之公开 —— 实测 \`web-front\` 与 \`ej-backend\` 都能**匿名** \`docker pull\`，NAS 上**不需要** \`docker login\`。万一哪天 \`pull\` 报 \`denied\`/\`unauthorized\`，说明那个包是 private，两条路：① NAS 上 \`docker login ghcr.io -u <你的用户名>\`，密码填带 \`read:packages\` 的 PAT，一次就够；② 把包改成公开 —— 包页 → 右侧齿轮 **Package settings** → **滚到页面最底部的 Danger Zone** → **Change visibility**（入口藏得深，容易找不到）。注意公开后**不能再改回私有**。

          经反代 / 内网穿透暴露时**必须**打开的那个开关、局域网 \`http\` 下地理定位与 PWA 安装为什么失效、OneDrive 在 Azure 里要加的重定向 URI、WebDAV 只读代理的细节、以及一整套排错表——都在仓库文档里，这一页不重复：**[docs/web-display-deploy.md](https://github.com/${GITHUB_REPOSITORY}/blob/${GITHUB_SHA}/docs/web-display-deploy.md)**
          HOWTO2
