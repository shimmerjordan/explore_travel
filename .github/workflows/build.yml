name: 构建与发布

# ════════════════════════════════════════════════════════════════════════
# 本仓库只有两条流水线：这一条负责**所有产出物**，test.yml 负责**所有测试**。
#
#   version ── 从 CHANGELOG.md 取版本号
#   test（调用 test.yml）── 三种语言的门禁，下面每一个 job 都 needs 它
#     ├─ image    GHCR 单镜像：web-front(48080) + ej-backend(48081) 双架构
#     ├─ site     公开站点 → web-build 分支 → Vercel / Cloudflare Pages
#     ├─ android  APK
#     ├─ ios      IPA
#     └─ release  把 APK / IPA 挂到 GitHub Release
#
# ── 一次发布，四个产物，同一个版本号 ────────────────────────────────────
# 镜像、web 产物、APK、IPA **每次都全部构建**，并且都打同一个版本号。以前它们
# 各有一套开关、各自决定版本（镜像用 sha、APK 用手填的 tag、web 产物压根没有
# 版本），于是「线上这个镜像对应哪个 APK」没人答得上来。现在一次运行就是一次
# 完整发布，四个产物同版本，Release 说明里把四个一起列出来。
#
# ── 版本号来自 CHANGELOG.md ──────────────────────────────────────────────
# `scripts/version.sh` 取所有 `## ` 标题里最大的语义化版本号（与 xyz-studio-max
# 的 conanfile.py:get_version_changelog() 同一套做法）。**不靠 git tag**：tag 是
# 发布的结果而不是来源，靠它意味着「先打 tag 再构建」，而 tag 打错了还得删。
# CHANGELOG 是写变更时顺手就改的地方，让它当唯一来源，版本号与变更说明天然同步。
# 每次 push 的门禁里有 `version.sh --check`，会拦住 CHANGELOG 与 pubspec 的漂移。
# 想临时发一个别的号（例如 0.2.1-rc.1），用 version 输入覆盖它。
#
# 合并前是 4 条流水线（flutter-check / deploy-web / image / release）。代价有三个：
#   · analyze + test 有 4 份复制，改一处漏三处；
#   · 跨 workflow 没有依赖关系，测试红了照样能把镜像推上 GHCR、把站点发到公网；
#   · 一次 push 亮 3 条流水线，得点进 3 个地方才知道这次到底成没成。
#
# ── 这条流水线只能手动触发 ──────────────────────────────────────────────
# **push 不会触发它。** 每次 push 自动跑的只有 test.yml。理由是这里的每一个 job
# 都是「对外发生副作用」的动作，而且都很贵：
#   · image  —— 交叉编译两个架构 + 在 QEMU 下跑四套容器冒烟，约 40 分钟，
#                成功即把 GHCR 上的 `latest` 顶掉（NAS 上 compose 拉的就是它）
#   · site   —— 强制重写 web-build 分支，Vercel 随即把公开站点换掉
#   · release —— 建 / 更新 GitHub Release
# 这些该由人决定「现在发」，而不是由「我推了一行代码」决定。所以门禁自动化、
# 发布手动化：push 只回答「代码是好的吗」，这条流水线回答「现在要发出去吗」。
#
# 也因此这里不再需要 workflow 级 paths 与按 diff 细筛的 changes job —— 手动触发
# 本来就没有 diff 可算，「要不要发」由人按下按钮那一刻决定。
#
# ── 怎么用 ──────────────────────────────────────────────────────────────
# Actions 页 → 构建与发布 → Run workflow。第一个 job 一定是测试（调用 test.yml，
# 与 push 上跑的是同一份定义），红了后面全不动 —— 手动发布也绕不过门禁。
#
#   正常发布      三个输入全用默认，直接跑
#   只验证不发布  publish 取消勾选（四个产物照编照验，但一个都不推出去）
#   发个别的号    version 填 0.2.1-rc.1
#
# 可选 secrets（不配也能跑，产出降级为可侧载的包）：
#   ANDROID_KEYSTORE_BASE64 / ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
#   IOS_CERTIFICATE_BASE64 / IOS_CERTIFICATE_PASSWORD
#   IOS_PROVISIONING_PROFILE_BASE64 / IOS_TEAM_ID / IOS_EXPORT_METHOD
# ════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号。留空 = 用 CHANGELOG.md 里的（推荐）。填了则覆盖，例如 0.2.1-rc.1'
        required: false
        default: ''
      publish:
        description: '真的发布？取消勾选 = 四个产物照编照验，但不推 GHCR / 不动 web-build / 不建 Release'
        type: boolean
        default: true
      prerelease:
        description: 'GitHub Release 标记为预发布？'
        type: boolean
        default: true
      on_conflict:
        description: '这个版本号已经发过了怎么办'
        type: choice
        options:
          - pre          # 自动加 -pre.N 发一个新的（默认，不动已发布的东西）
          - overwrite    # 覆盖：tag 移到当前 commit，Release 与镜像 tag 一并顶掉
          - fail         # 直接失败
        default: pre

# 一次发布跑到一半不该被顶掉，所以不取消进行中的运行 —— 第二次触发排队等着。
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}/app

jobs:
  # ───────────────────────── 版本号 ─────────────────────────
  # 单独一个 job 只为「算一次，四个产物共用」。放在最前面，版本号算不出来
  # （CHANGELOG 里没有版本标题）就不必白编 40 分钟。
  version:
    name: 版本号
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.v.outputs.version }}
      tag: ${{ steps.v.outputs.tag }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      overwrite: ${{ steps.v.outputs.overwrite }}
    steps:
      - uses: actions/checkout@v4
        # fetch-depth: 0 —— resolve-version.sh 要读已有 tag 才能判断这个版本号
        # 发没发过。默认的浅克隆一个 tag 都看不到, 判定会永远认为"没发过"。
        with:
          fetch-depth: 0
      - id: v
        env:
          OVERRIDE: ${{ github.event.inputs.version }}
        run: |
          set -euo pipefail
          FROM_CHANGELOG=$(./scripts/version.sh)
          if [ -n "${OVERRIDE:-}" ]; then
            V="$OVERRIDE"
            echo "::notice::版本由手动输入指定：$V（CHANGELOG.md 里是 $FROM_CHANGELOG）"
          else
            V="$FROM_CHANGELOG"
            echo "::notice::版本取自 CHANGELOG.md：$V"
          fi
          # 版本号已经发过时怎么办 —— 与 repo_git / photo-ar / cc-trans 共用
          # 同一份 scripts/resolve-version.sh, 保证四个仓库行为一致。
          RV="$(./scripts/resolve-version.sh "$V" "${{ github.event.inputs.on_conflict }}")"
          V="$(printf '%s\n' "$RV" | sed -n 's/^version=//p')"
          VTAG="$(printf '%s\n' "$RV" | sed -n 's/^vtag=//p')"
          PRE="$(printf '%s\n' "$RV" | sed -n 's/^prerelease=//p')"
          OW="$(printf '%s\n' "$RV" | sed -n 's/^overwrite=//p')"
          printf 'version=%s\ntag=%s\nprerelease=%s\noverwrite=%s\n' \
            "$V" "$VTAG" "$PRE" "$OW" >> "$GITHUB_OUTPUT"
          {
            echo "## 发布 v$V"
            echo ""
            echo "| 产物 | 版本 |"
            echo "|---|---|"
            echo "| GHCR 镜像 | \`${IMAGE}:v$V\` |"
            echo "| APK / IPA | \`$V+${GITHUB_RUN_NUMBER}\` |"
            echo "| 公开站点 | \`$V\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ───────────────────────── 门禁 ─────────────────────────
  # 三种语言的测试定义在 test.yml 里（唯一一处）。下面每个 job 都 needs 它，
  # 所以「测试红了就不发布」是真的依赖关系，不是两条流水线各自跑各自的。
  test:
    name: 测试
    uses: ./.github/workflows/test.yml

  # ───────────────────── GHCR 单镜像（双架构）─────────────────────
  # 一个容器同时跑：
  #   · web-front（Rust，48080）—— admin 登录 + 加密配置保管 + 运维看板
  #     + Flutter web 静态托管 + 只读 WebDAV 代理
  #   · ej-backend（Node，48081）—— 社区排行榜 + 组队中继
  # 由 supervisord 带起，两个进程各自降权到合并前的 UID（65532 / 1000）。
  #
  # 为什么是交叉编译而不是 QEMU 模拟编译：在 QEMU 下编译 Rust 单架构就要 40 分钟
  # 以上（ring 还要现编 C 与汇编），交叉编译在原生速度下几分钟完事。见根 Dockerfile。
  #
  # `publish` 取消勾选时，编译与四套冒烟照常全跑，只是不登录、不算标签、不推送 ——
  # 想验证一次镜像改动而不顶掉 GHCR 上的 `latest` 时用它。
  image:
    name: GHCR 镜像（双架构 + 两套冒烟）
    needs: [version, test]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write # 推 GHCR 需要
    steps:
      - uses: actions/checkout@v4

      # Flutter 版本钉在 .github/actions/flutter-setup 里，连 pub get 一起做。
      - uses: ./.github/actions/flutter-setup

      # 只构建一次，两个架构共用（纯静态资源与架构无关）。必须在 docker build
      # 之前：Dockerfile 的 `COPY web-front/web-dist/ /web/` 不是可选的。
      - name: 构建 Flutter web 产物
        env:
          V: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # 与 APK / IPA / 站点同一个版本号，好让「镜像里这份前端是哪个版本」
          # 在 App 内的关于页就能看到（package_info 读的就是 build-name）。
          flutter build web --release --build-name="$V" --build-number="$GITHUB_RUN_NUMBER"
          # 先清空再拷：残留的上一次产物会被一起打进镜像，而 Flutter 的文件名
          # 并非全都带内容哈希，旧文件不会被新文件覆盖掉。
          rm -rf web-front/web-dist
          mkdir -p web-front/web-dist
          cp -r build/web/. web-front/web-dist/
          # 产物必须全局可读：COPY 保留宿主权限位，0600 的文件在镜像里对
          # nonroot 不可读（见根 Dockerfile 里 /web 那段注释）。
          chmod -R a+rX web-front/web-dist
          echo "产物大小：$(du -sh web-front/web-dist | cut -f1)"
          test -f web-front/web-dist/index.html || {
            echo "::error::web-dist 里没有 index.html —— 镜像会退化成只有说明页"; exit 1; }

      # QEMU 只用于「跑」arm64 的容器做冒烟，不用于编译。
      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64
      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        if: github.event.inputs.publish == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 计算镜像标签
        id: meta
        if: github.event.inputs.publish == 'true'
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          # 三个标签各有用途：
          #   v<版本>  —— 与 APK / IPA / 站点同号，是「这次发布」的名字
          #   sha-<7>  —— 可复现发布的锚点（同一个版本重跑一次也能区分）
          #   latest   —— 只在默认分支上打，否则一条特性分支的运行会把它抢走，
          #               而 latest 正是 compose 文件默认拉的那个
          tags: |
            type=raw,value=${{ needs.version.outputs.tag }}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      # 先单架构 load 到本地 daemon，才能把容器真跑起来验。
      # context 是仓库根（Dockerfile 要同时拿到 web-front/ 与 backends/ 两棵子树）；
      # 上下文体积由 .dockerignore 的白名单控制。
      - name: 编译 amd64（加载到本地）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ej-app:smoke-amd64
          cache-from: type=gha,scope=app-amd64
          cache-to: type=gha,scope=app-amd64,mode=max

      # 两套冒烟都指向同一个合并镜像。它们各自的 docker run 只挂 /data 并覆盖
      # 环境变量，entrypoint 会补建两个子目录 —— 所以脚本本身不用改，只需要
      # 让它们别再自己 build（web-front 那套默认就不 build，后端那套用 SKIP_BUILD=1）。
      - name: 冒烟 amd64 · web-front 完整 API
        working-directory: web-front
        run: IMAGE=ej-app:smoke-amd64 ./scripts/docker-smoke.sh

      - name: 冒烟 amd64 · 后端容器级 E2E
        working-directory: backends
        run: SKIP_BUILD=1 E2E_IMAGE=ej-app:smoke-amd64 ./scripts/docker-e2e.sh

      - name: 编译 arm64（加载到本地）
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64
          load: true
          tags: ej-app:smoke-arm64
          cache-from: type=gha,scope=app-arm64
          cache-to: type=gha,scope=app-arm64,mode=max

      # arm64 也跑完整套，不只是启动探测：ring 有 aarch64 专用汇编、Argon2
      # 有架构相关实现路径、bundled SQLite 是交叉编译出来的 C 代码 —— 这些
      # 「能链接」不等于「算得对」，只有真正打一遍 API 才能发现。
      # 曾经这里降级成 LEVEL=boot，理由是 Argon2 在模拟下太慢；实测（qemu-aarch64
      # 跑同一个交叉编译产物）注册 0.115 s、单次 Argon2 验证 0.096 s，理由不成立。
      - name: 冒烟 arm64 · web-front 完整 API + 架构核对
        working-directory: web-front
        run: IMAGE=ej-app:smoke-arm64 PLATFORM=linux/arm64 ./scripts/docker-smoke.sh

      # PLATFORM 与 web-front 那步同一个约定：既让 docker 别再警告「没指定平台」，
      # 也让脚本核对镜像架构确为 arm64，并放宽依赖宿主内核如实上报的断言
      # （QEMU 下 /api/status 的 rssMb 恒为 0，见 backends/test/docker-e2e.test.js）。
      - name: 冒烟 arm64 · 后端容器级 E2E + 架构核对
        working-directory: backends
        run: SKIP_BUILD=1 E2E_IMAGE=ej-app:smoke-arm64 PLATFORM=linux/arm64 ./scripts/docker-e2e.sh

      # 升级路径。合并成单镜像之前两个服务各自把 /data 当自己的根，现在分住
      # /data/web 与 /data/backend，entrypoint 要把旧布局搬过去。这一步造一份
      # 旧布局再启动，验证搬对了、重复启动不重复搬、目标已存在时不覆盖。
      # **没有这条，用户升级时静默丢数据的风险没有任何拦阻。**
      - name: 验证旧数据布局的迁移
        run: |
          set -euo pipefail
          VOL=ej-mig-ci
          docker volume rm "$VOL" >/dev/null 2>&1 || true
          docker volume create "$VOL" >/dev/null
          docker run --rm -v "$VOL:/d" alpine sh -c '
            printf "{}" > /d/admin.json
            printf "{}" > /d/config.json
            printf "[{\"peerId\":\"pre-merge\"}]" > /d/leaderboard.json'
          docker run -d --name ej-mig-ci -v "$VOL:/data" ej-app:smoke-amd64 >/dev/null
          for _ in $(seq 1 60); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' ej-mig-ci)" = healthy ] && break
            sleep 1
          done
          docker logs ej-mig-ci 2>&1 | grep -q '发现合并前的数据布局' \
            || { echo "::error::迁移没有触发"; docker logs ej-mig-ci; exit 1; }
          docker exec ej-mig-ci test -f /data/web/admin.json
          docker exec ej-mig-ci test -f /data/backend/leaderboard.json
          docker exec ej-mig-ci sh -c 'grep -q pre-merge /data/backend/leaderboard.json' \
            || { echo "::error::迁移后内容不对"; exit 1; }
          # 重启不该再搬一次（判据是文件位置，不是标记文件，所以天然幂等）
          BEFORE=$(docker exec ej-mig-ci cat /data/backend/leaderboard.json)
          docker restart ej-mig-ci >/dev/null; sleep 6
          AFTER=$(docker exec ej-mig-ci cat /data/backend/leaderboard.json)
          [ "$BEFORE" = "$AFTER" ] || { echo "::error::重启后数据变了"; exit 1; }
          # 目标已存在时不覆盖，旧文件原地留着让人自己看
          docker exec ej-mig-ci sh -c 'printf "{}" > /data/leaderboard.json'
          docker restart ej-mig-ci >/dev/null; sleep 6
          docker logs ej-mig-ci 2>&1 | tail -20 | grep -q '跳过 leaderboard.json' \
            || { echo "::error::目标已存在时没有跳过，可能覆盖了数据"; exit 1; }
          docker rm -f ej-mig-ci >/dev/null
          docker volume rm "$VOL" >/dev/null
          echo "迁移、幂等、不覆盖 三项均通过"

      - name: 推送双架构 manifest
        id: push
        if: github.event.inputs.publish == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=app-amd64
            type=gha,scope=app-arm64

      # 运行摘要页是点进一次运行后落地的地方。没有它就只是一片绿勾，
      # 看不出发布了什么、怎么部署。
      #
      # 缩进说明：下面所有内容都在块标量的基准缩进上，YAML 会把它剥掉，
      # heredoc 正文到达 shell 时在第 0 列 —— 这样 markdown 才不会被渲染
      # 成代码块。别给这些行重新加缩进。
      - name: 写入运行摘要
        if: always()
        env:
          JOB_STATUS: ${{ job.status }}
          TAGS: ${{ steps.meta.outputs.tags }}
          DIGEST: ${{ steps.push.outputs.digest }}
          VERSION: ${{ needs.version.outputs.version }}
          VTAG: ${{ needs.version.outputs.tag }}
          # publish 取消勾选 = 只验证不推送。摘要按这个分叉，别让人以为发出去了。
          VERIFY_ONLY: ${{ github.event.inputs.publish != 'true' }}
        run: |
          S="$GITHUB_STEP_SUMMARY"

          if [ "$JOB_STATUS" = success ]; then
            if [ "$VERIFY_ONLY" = true ]; then
              echo "## ✅ 应用镜像验证通过（本次只验证，未推送）" >> "$S"
            else
              echo "## ✅ 应用镜像已发布到 GHCR" >> "$S"
            fi
          else
            {
              echo "## ❌ 镜像构建失败（状态：$JOB_STATUS）"
              echo ""
              echo "排查：展开上面失败的那一步；两套冒烟失败都会自动打印容器日志。"
              echo "本机复现："
              echo '```bash'
              echo "docker build -t ej-app:test ."
              echo "cd web-front && IMAGE=ej-app:test ./scripts/docker-smoke.sh"
              echo "cd backends && SKIP_BUILD=1 E2E_IMAGE=ej-app:test ./scripts/docker-e2e.sh"
              echo '```'
            } >> "$S"
          fi

          cat >> "$S" <<'HEADER'

          **发布对象**：一个镜像两个服务 —— `web-front`（Rust，48080：单 admin 登录 + 加密配置保管 + 运维看板 + Flutter web 静态托管 + 只读 WebDAV 代理）与 `ej-backend`（Node，48081：社区排行榜 + 组队中继），由 supervisord 带起，两个进程分别以 UID 65532 / 1000 运行，各自只写得动自己的数据目录。镜像里带着本次构建的 web 产物。

          HEADER

          {
            echo "| 项 | 值 |"
            echo "|---|---|"
            echo "| 架构 | \`linux/amd64\` + \`linux/arm64\`（同一个 manifest，pull 时自动选） |"
            echo "| 摘要 digest | \`${DIGEST:-—（PR 不推送）}\` |"
            echo "| 提交 | \`${GITHUB_SHA:0:7}\` |"
            echo "| 基础镜像 | \`node:22-bookworm-slim\` + supervisor |"
            echo "| 对外端口 | 48080（web）· 48081（backend） |"
          } >> "$S"

          if [ -n "$TAGS" ]; then
            {
              echo ""
              echo "**本次标签**"
              echo ""
              echo '```'
              echo "$TAGS"
              echo '```'
            } >> "$S"
          fi

          cat >> "$S" <<'VERIFIED'

          ### 本次验证了什么

          测试（Flutter analyze + 约 500 个 flutter test、后端 node --test、web-front cargo test）由本次运行的 `测试` job 统一跑，红了这个 job 根本不会启动。镜像侧额外做的是：

          - **web-front 完整 API 冒烟 · amd64 与 arm64 各一遍** —— 默认口令能登录且自报 `is_default_password` → 未鉴权时配置/指标/导出全部 401 → 配置往返字节一致 → 导出默认脱敏而 `secrets=1` 才出明文 → 看板页免 session 可取 → 无 web 产物时根路径给说明页、带扩展名的路径给 JSON 404 → **改密后用新口令仍能读出配置（验证重加密真的发生了）** → `docker restart` 后会话消失而口令与密文都还在 → 代理关闭时连功能存在都不暴露、打开后写动词 405 且穿越 403
          - **后端容器级 E2E · amd64 与 arm64 各一遍** —— 开放模式与令牌强制模式各跑一轮完整 API、数据正确性、中继、重启持久化
          - **升级路径** —— 造一份合并前的数据布局，验证首次启动把它搬进 `/data/web` 与 `/data/backend`、内容完好、重启不重复搬、目标已存在时不覆盖
          - **为什么 arm64 也要打全套** —— ring 有 aarch64 专用汇编、Argon2 有架构相关路径，「能链接」不等于「算得对」；同时核对镜像架构确为 `arm64`，防止交叉编译静默产出宿主架构的产物

          VERIFIED

          if [ "$VERIFY_ONLY" = true ]; then
            cat >> "$S" <<'PRNOTE'
          ### 本次不发布

          `publish` 没有勾选，所以只编译 + 跑冒烟，没有推送。同一次运行重新勾上
          `publish` 再跑一遍即可发布（buildx 的 gha 缓存已经热了，会快很多）。

          PRNOTE
            exit 0
          fi

          cat >> "$S" <<HOWTO

          ### 从两个容器升级到这一个

          原先跑着 \`web-front\` 与 \`ej-backend\` 两个容器的话，按这个顺序换。统一镜像**只挂一个** \`/data\`，容器内自己分 \`web/\` 与 \`backend/\` 两个子目录（属主分别是 65532 / 1000），所以旧的两个数据目录要先并成那个形状：

          \`\`\`bash
          cd /share/Web/ej_data          # 换成你放数据的那层父目录

          # ① 备份（下面只是改名，但备份不要省）
          sudo tar czf ej-backup-\$(date +%F).tgz front backend

          # ② 停掉旧的两个
          sudo docker rm -f web-front ej-backend

          # ③ 搬成统一镜像期望的布局。mv 保留属主，**不需要再 chown**
          sudo mkdir -p app
          sudo mv front   app/web
          sudo mv backend app/backend
          \`\`\`

          目录名对上之后就不会触发 entrypoint 的迁移逻辑——文件已经在它期望的位置了。启动日志里应当看到 \`web-front → /data/web (65532) · backend → /data/backend (1000)\`，而**不该**出现「发现合并前的数据布局」；出现了说明第 ③ 步没搬对。

          （旧数据本来就直接躺在 \`/data\` 根上、没分过子目录的话，把它整个挂进来即可，entrypoint 第一次启动会把 \`admin.json\` / \`config.json\` / \`metrics.json\` 搬进 \`web/\`、\`leaderboard.json\` 搬进 \`backend/\`，幂等且目标已存在时不覆盖。）

          ### 在 NAS 上部署

          **① 写 compose**

          下面这份就是仓库里的 \`deploy/docker-compose.nas.yml\`，刻意**一个 \`\${变量}\` 都不含**——可以整段粘进 QNAP Container Station / 群晖 Container Manager 的「创建应用程序」YAML 框（那些界面不做插值，粘带变量的进去会以 \`invalid reference format\` 失败）。命令行 + \`.env\` 的用法请用仓库根的 \`docker-compose.ghcr.yml\`。

          **注意 compose 文件本身别放进 \`app/\`**，否则它会出现在容器的 \`/data\` 里。放它的上一层。

          HOWTO

          {
            echo '```bash'
            echo "cd /share/Web/ej_data && cat > docker-compose.yml <<'YAML'"
            cat deploy/docker-compose.nas.yml
            echo 'YAML'
            echo '```'
          } >> "$S"

          cat >> "$S" <<HOWTO2

          镜像那行默认是 \`:latest\`，**每次发布都会自动指向最新一次成功构建**，所以 NAS 上 \`compose pull\` 就能升级，不用改文件。想钉死本次这个版本（可复现、可回滚）就把它换成：

          \`\`\`yaml
              image: ${IMAGE}:${VTAG}
          \`\`\`

          **② 起服务并自检**

          \`\`\`bash
          sudo docker compose up -d
          curl localhost:48080/healthz          # → {"status":"ok"}
          curl localhost:48081/healthz          # → ok
          sudo docker compose logs | grep entrypoint   # 看数据目录与迁移结果
          \`\`\`

          **③ 立刻改掉默认口令**

          浏览器打开 \`http://<NAS>:48080/admin\`，用 \`admin\` / \`admin\` 登录——顶部会挂一条红色横幅，改密表单就内联在里面。**任何能连到这个端口的人都能用默认口令登录并读走你全部云凭据。**

          之后在手机 App 的 **备份 → 「Web 前端 · 配置推送」** 里把配置推上来，浏览器打开 \`http://<NAS>:48080/\` 就能看数据了。

          ### 之后的运维

          \`\`\`bash
          # 升级到最新一次发布（compose 里写的是 :latest，每次发布自动指过来）
          sudo docker compose pull && sudo docker compose up -d

          # 钉版本 / 回滚：把 compose 里 image 那行的 :latest 换成 :${VTAG}
          # 或某个更早的 :v… / :sha-…，再 up -d。这份 compose 不用变量，直接改字面量。

          # 只重启其中一个服务（不动另一个）
          sudo docker exec ej-app supervisorctl -c /etc/supervisor/conf.d/supervisord.conf restart backend

          # 备份（两个子目录一起）
          sudo tar czf ej-backup-\$(date +%F).tgz -C /share/Web/ej_data/app .

          # WebDAV 用户需要打开只读代理（浏览器无法直连 WebDAV）
          # 在 compose 的 environment 里把 EJ_PROXY_ENABLED 改成 "1"
          \`\`\`

          ### 几个容易踩的点

          - **端口**：\`48080\` / \`48081\` 是刻意选的高端口。家宽运营商封 \`80\` / \`443\` / \`8080\` 的入方向，配到那三个上从公网连不上。
          - **数据别放网络盘**：挂进 \`/data\` 的那个目录必须在 NAS 本地文件系统上。落盘用「写临时文件 → fsync → 原子改名 → fsync 目录」，NFS/SMB 对这套语义不可靠。
          - **别设 \`EJ_DATA_DIR\` / \`DATA_DIR\`**：镜像里已经是 \`/data/web\` 与 \`/data/backend\`。照抄合并前那份 compose 里的 \`EJ_DATA_DIR: "/data"\` 会让 web-front 往 \`/data\` 根上写，下次启动 entrypoint 又把它当「旧布局」搬一遍。
          - **旧的 \`web-front\` / \`ej-backend\` 两个包已经不再更新**（流水线合并时就停了）。还拉着它们的 \`:latest\` 的话，看到的永远是合并之前那一版——换成上面这份 compose 里的 \`app\` 包。
          - **忘记 admin 口令 = 已存的配置永久读不出来**。配置是用口令派生的密钥加密的，没有恢复通道。出路是从手机端重推一份覆盖它。
          - **地理定位与 PWA 安装需要安全上下文**：用 \`http://<局域网IP>:48080\` 打开时浏览器不给这些能力。在 NAS 本机用 \`localhost\`，或前面套个带证书的反代。
          - **必须置于带超时的反代之后**：web 侧是 thread-per-request 的，8 个慢速连接就能把全部 worker 占死。反代需要**同时**有读超时与响应写超时（或做响应缓冲）。
          - **经反代暴露时两个 TRUST_PROXY 都要开**（\`EJ_TRUST_PROXY=1\` 与 \`TRUST_PROXY=1\`），否则两个服务的限流都按反代自己的 IP 分桶，等于没有限流。
          - **OneDrive 重定向 URI**：Azure 应用注册里要加 SPA 平台的 \`http://<NAS>:48080/auth.html\`。
          - **镜像可见性**：本仓库是公开的，经 Actions 用 \`GITHUB_TOKEN\` 推送的包会关联到仓库并随之公开，NAS 上**不需要** \`docker login\`。万一 \`pull\` 报 \`denied\`/\`unauthorized\`，说明那个包是 private，两条路：① NAS 上 \`docker login ghcr.io -u <你的用户名>\`，密码填带 \`read:packages\` 的 PAT；② 包页 → 齿轮 **Package settings** → **页面最底部的 Danger Zone** → **Change visibility**。注意公开后**不能再改回私有**。
          HOWTO2

      - name: 失败时打印容器日志
        if: failure()
        run: |
          docker ps -a
          for n in $(docker ps -aq); do
            echo "── $(docker inspect -f '{{.Name}}' "$n")"
            docker logs "$n" 2>&1 | tail -60
          done

  # ───────────────────── 公开站点 → web-build 分支 ─────────────────────
  # 这个 job 与上面的镜像**不是**重复的，别因为两边都跑 `flutter build web`
  # 就把它删掉：
  #
  #   · 这里产出的是**合并站点**（scripts/build-site.sh）：宣传落地页在 `/`、
  #     Flutter 应用在 `/app/`，base-href 是 `/app/`。推到 `web-build` 分支，
  #     由 Vercel / Cloudflare Pages 直接部署，面向公网访客。
  #   · 镜像里那份是**纯应用**，base-href 是 `/`，由 NAS 上的服务端托管，
  #     面向已经有 admin 口令的自己。
  #
  # 两份产物的 base-href 不同，所以物理上无法共用一次构建；而镜像里根本没有
  # `website/` 的落地页。删掉这个 job 等于静默废掉宣传站的部署。
  #
  # 用 build 分支而不是平台 CLI/token 推送：Vercel 的原生 Git 集成免费给预览
  # URL、回滚与部署面板，也不用在 GitHub 里存 Vercel token；`web-build` 本身
  # 就是个可直接部署的产物，NAS / Nginx / Pages 用同样的设置都能托管。
  site:
    name: 公开站点 → web-build
    needs: [version, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # 推 web-build 分支
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/flutter-setup

      # → ./dist（落地页在 /，应用在 /app/）。版本号经环境变量透传给脚本里的
      # flutter build web，与其余三个产物同号。
      - run: bash scripts/build-site.sh
        env:
          BUILD_NAME: ${{ needs.version.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}

      - name: Publish ./dist to web-build branch
        if: github.event.inputs.publish == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: web-build
          # 单提交孤儿分支：每次推送都提交构建产物，不这样做仓库会被历史撑爆。
          force_orphan: true
          commit_message: 'build: web from ${{ github.sha }}'

  # ───────────────────────── Android APK ─────────────────────────
  # 零配置即可跑：不配 secrets 时用仓库里那把固定的侧载密钥签名（所以历次构建
  # 都能覆盖安装）；配了 ANDROID_KEYSTORE_BASE64 就升级为生产签名。
  android:
    name: Android APK
    needs: [version, test]
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      # composite 顺带做了 flutter pub get。提前是安全的：中间的 gomobile 只写
      # android/app/libs/*.aar、签名步只写 android/key.properties，都与 pub get
      # 互不读写。
      - uses: ./.github/actions/flutter-setup

      # 内嵌 frpc（组队的 frp 通道）。best-effort：gomobile 编不出来 APK 照样能编，
      # 只是不带 frp（gradle 只在 libs/frpmobile.aar 存在时链接它，桥退化为
      # 「unsupported」）。所以 frp 工具链打嗝从不阻塞发版。
      - name: Set up Go (embedded frpc)
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build embedded frpc (Android AAR)
        continue-on-error: true
        run: |
          set -euo pipefail
          export PATH="$PATH:$(go env GOPATH)/bin"
          NDK_DIR=$(ls -d "$ANDROID_HOME"/ndk/* 2>/dev/null | sort -V | tail -1 || true)
          if [ -n "$NDK_DIR" ]; then export ANDROID_NDK_HOME="$NDK_DIR"; fi
          echo "Using NDK: ${ANDROID_NDK_HOME:-<none>}"
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          cd native/frpmobile
          go mod tidy
          # `gomobile bind` 需要 golang.org/x/mobile 在模块图里，但 frp.go 不 import
          # 它，`go mod tidy` 会把它剥掉。显式加回来（用模块形式，避免 `.../bind`
          # 的宿主构建约束报错）。必须在 tidy 之后，否则又被剥掉。
          go get golang.org/x/mobile@latest
          mkdir -p ../../android/app/libs
          gomobile bind -target=android -androidapi 23 -o ../../android/app/libs/frpmobile.aar .
          ls -lah ../../android/app/libs/ || true

      # 不能把 `secrets.X != ''` 直接写进 step 级 `if:` —— GitHub 的表达式解析器
      # 拒绝在那个位置解析 secrets 上下文。所以检查放进脚本里：env 为空就早退。
      - name: Configure Android signing (optional)
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_B64:-}" ]; then
            echo "::notice::No ANDROID_KEYSTORE_BASE64 secret — release APK will be signed with the committed stable sideload key (android/keystore/explore-release.jks), so 覆盖安装 works across builds."
            exit 0
          fi
          mkdir -p android/app
          echo "$KEYSTORE_B64" | base64 -d > android/app/upload.keystore
          cat > android/key.properties <<EOF
          storePassword=$STORE_PASS
          keyPassword=$KEY_PASS
          keyAlias=$KEY_ALIAS
          storeFile=upload.keystore
          EOF
          echo "::notice::Upload keystore wired — release APK will be production-signed."

      # 通用 APK —— 一个包同时含 armv7 / arm64 / x86_64。大（约 70-100 MB）但装得上
      # 每台设备，也绕开了 split-per-abi 与已装包签名不同导致的「软件包与现有软件包
      # 存在冲突」。要给应用商店做分包就在本地跑 `--release --split-per-abi`：
      # CI 这里的产物是给侧载用的，一包通吃比体积更重要。
      - name: Build APK (universal)
        env:
          V: ${{ needs.version.outputs.version }}
        run: flutter build apk --release --build-name="$V" --build-number="$GITHUB_RUN_NUMBER"

      - name: Rename APK
        id: find_apk
        run: |
          set -euo pipefail
          ls -lah build/app/outputs/flutter-apk/
          TAG="${{ needs.version.outputs.tag }}"
          cp build/app/outputs/flutter-apk/app-release.apk \
             "explore_journal-${TAG}-android-universal.apk"
          ls -lah explore_journal-${TAG}-android-universal.apk
          echo "name=explore_journal-${TAG}-android" >> "$GITHUB_OUTPUT"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: ./explore_journal-*-android-universal.apk
          if-no-files-found: error
          retention-days: 14

  # ─────────────────────────── iOS IPA ───────────────────────────
  # 不配 secrets 时产出未签名 IPA（用 AltStore / Sideloadly / TrollStore 侧载）；
  # 配了 IOS_CERTIFICATE_BASE64 就产出生产签名的 IPA。
  ios:
    name: iOS IPA
    needs: [version, test]
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # composite 顺带做了 flutter pub get。提前是安全的：gomobile 只写
      # ios/frpmobile/，与 pub get 互不读写；pod install 仍留在原位 —— 它必须
      # 同时晚于 pub get 与 gomobile，见下。
      - uses: ./.github/actions/flutter-setup

      # 内嵌 frpc。best-effort，同 Android：Podfile 只在 xcframework 存在时 vendor
      # 它，AppDelegate 的桥有 `#if canImport` 守卫。必须早于 pod install，
      # CocoaPods 才能把它捡起来。
      - name: Set up Go (embedded frpc)
        uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - name: Build embedded frpc (iOS XCFramework)
        continue-on-error: true
        run: |
          set -euo pipefail
          export PATH="$PATH:$(go env GOPATH)/bin"
          go install golang.org/x/mobile/cmd/gomobile@latest
          gomobile init
          cd native/frpmobile
          go mod tidy
          go get golang.org/x/mobile@latest
          gomobile bind -target=ios -o ../../ios/frpmobile/Frpmobile.xcframework .
          ls -lah ../../ios/frpmobile/ || true

      # Podfile 读 ios/Flutter/Generated.xcconfig 与 .flutter-plugins-dependencies，
      # 两者都由 pub get 生成（上面的 composite 已做）；xcframework 是否 vendor 也在
      # 这时判定，所以这一步必须晚于 gomobile 那步 —— 别把它往上挪。
      - name: iOS pod install
        run: cd ios && pod install --repo-update

      # 同 Android 那段：step 级 `if:` 里不能引用 secrets。用一个 detect 步把
      # 「secret 在不在」变成普通的 step output，后面的步骤 gate 在它上面。
      - name: Detect iOS signing assets
        id: detect
        env:
          CERT_B64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
        run: |
          if [ -n "${CERT_B64:-}" ]; then
            echo "signed=true" >> "$GITHUB_OUTPUT"
            echo "::notice::iOS signing secrets present — will build a signed IPA."
          else
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "::notice::No IOS_CERTIFICATE_BASE64 — will build an unsigned IPA (sideload-only)."
          fi

      # 证书装进临时 keychain，profile 放到标准的 Library/MobileDevice 路径下，
      # 这样 `flutter build ipa` / xcodebuild 才找得到。
      - name: Install code-signing assets
        if: steps.detect.outputs.signed == 'true'
        env:
          CERT_B64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          CERT_PASS: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          PROFILE_B64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          KEYCHAIN=runner.keychain
          KEYCHAIN_PASS=$(uuidgen)
          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN"
          security set-keychain-settings -lut 7200 "$KEYCHAIN"

          echo "$CERT_B64" | base64 -d > cert.p12
          security import cert.p12 -k "$KEYCHAIN" -P "$CERT_PASS" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASS" "$KEYCHAIN"
          rm cert.p12

          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$PROFILE_B64" | base64 -d \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/build.mobileprovision"

      - name: Build IPA (unsigned)
        if: steps.detect.outputs.signed == 'false'
        env:
          V: ${{ needs.version.outputs.version }}
        # 产出 build/ios/iphoneos/Runner.app（无签名）。把 .app 塞进 Payload/ 再
        # 打成 zip，结果就是 .ipa 的形状，侧载器（AltStore / Sideloadly）能在安装
        # 时重签 —— 这是没有 Apple 开发者证书时唯一合法的出包方式。
        run: |
          set -euo pipefail
          flutter build ios --release --no-codesign \
            --build-name="$V" --build-number="$GITHUB_RUN_NUMBER"

          APP=build/ios/iphoneos/Runner.app
          # ── 打包前先体检 ──────────────────────────────────────────────
          # 正确的 release .app 里应该嵌着 Flutter 引擎、Dart AOT（App.framework）
          # 以及每个插件的 framework。CocoaPods 没集成上（比如 Podfile 丢了）时
          # 应用照样编得出来，但会是个又小又坏的 IPA。宁可在这里大声失败。
          echo "── Runner.app size ──"; du -sh "$APP"
          echo "── Frameworks/ ──"
          ls -lah "$APP/Frameworks" || { echo "::error::Runner.app has NO Frameworks/ directory — CocoaPods did not integrate (check ios/Podfile)."; exit 1; }
          test -e "$APP/Frameworks/Flutter.framework/Flutter" || { echo "::error::Flutter.framework engine binary missing from the bundle."; exit 1; }
          test -e "$APP/Frameworks/App.framework/App" || { echo "::error::App.framework (Dart AOT) missing from the bundle."; exit 1; }
          FW_COUNT=$(ls "$APP/Frameworks" | wc -l | tr -d ' ')
          echo "Embedded frameworks: $FW_COUNT"
          if [ "$FW_COUNT" -lt 5 ]; then
            echo "::error::Only $FW_COUNT frameworks embedded — plugin pods are missing. Expected the engine + Dart + ~8 plugin frameworks."
            exit 1
          fi

          mkdir -p Payload
          cp -R "$APP" Payload/
          TAG="${{ needs.version.outputs.tag }}"
          # -y 保留 framework 里的符号链接，而不是把目标内容拷成副本。
          zip -qry "explore_journal-${TAG}-ios-unsigned.ipa" Payload
          ls -lah explore_journal-${TAG}-ios-unsigned.ipa
          SZ=$(stat -f%z "explore_journal-${TAG}-ios-unsigned.ipa")
          echo "IPA size: $((SZ / 1024 / 1024)) MB"
          if [ "$SZ" -lt 15000000 ]; then
            echo "::error::IPA is under 15 MB — that's far too small for this app and means native frameworks are missing."
            exit 1
          fi

      - name: Build IPA (signed)
        if: steps.detect.outputs.signed == 'true'
        env:
          EXPORT_METHOD: ${{ secrets.IOS_EXPORT_METHOD || 'development' }}
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          V: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          # ExportOptions.plist 与 secret 里的 method/team 对齐。automatic 签名让
          # 流水线对「实际用了哪张证书 + 哪个 profile」保持诚实。
          cat > /tmp/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>${EXPORT_METHOD}</string>
            <key>teamID</key><string>${TEAM_ID}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>stripSwiftSymbols</key><true/>
            <key>uploadSymbols</key><false/>
          </dict></plist>
          EOF
          flutter build ipa --release --export-options-plist=/tmp/ExportOptions.plist \
            --build-name="$V" --build-number="$GITHUB_RUN_NUMBER"
          TAG="${{ needs.version.outputs.tag }}"
          cp build/ios/ipa/*.ipa "explore_journal-${TAG}-ios.ipa"
          ls -lah explore_journal-${TAG}-ios.ipa
          SZ=$(stat -f%z "explore_journal-${TAG}-ios.ipa")
          echo "IPA size: $((SZ / 1024 / 1024)) MB"
          if [ "$SZ" -lt 15000000 ]; then
            echo "::error::Signed IPA under 15 MB — native frameworks likely missing (check ios/Podfile)."
            exit 1
          fi

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: ./explore_journal-*-ios*.ipa
          if-no-files-found: error
          retention-days: 14

  # ───────────────────── 发布 GitHub Release ─────────────────────
  release:
    name: GitHub Release
    # 也 needs 镜像与站点：说明里要如实写出这次发布的四个产物各自成没成，
    # 所以得等它们有结论。但**不要求**它们成功 —— 见下面的 if。
    needs: [version, image, site, android, ios]
    # 只要有一个移动端产物成功就发：另一个编失败时，用户仍然拿得到编出来的那个。
    # 镜像或站点失败不拦发版，但会在说明里写明「这次没发出去」。
    if: >-
      always()
      && github.event.inputs.publish == 'true'
      && (needs.android.result == 'success' || needs.ios.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # 建 Release 需要
    steps:
      - uses: actions/checkout@v4

      - name: Download Android APKs
        if: needs.android.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: android-apks
          path: artifacts

      - name: Download iOS IPA
        if: needs.ios.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: ios-ipa
          path: artifacts

      - name: List artifacts
        run: ls -lah artifacts/

      - name: Compose release notes
        env:
          TAG: ${{ needs.version.outputs.tag }}
          VERSION: ${{ needs.version.outputs.version }}
          SHA: ${{ github.sha }}
          IMAGE_RESULT: ${{ needs.image.result }}
          SITE_RESULT: ${{ needs.site.result }}
        # 说明文字靠翻 `artifacts/` 里的文件名拼出来，而**不是**再读一遍
        # `secrets.*` 上下文：GitHub 的表达式解析器在很多位置拒绝解析 secrets
        # （`run:` 块用 ${{ }} 内插正文就是其中之一，会报 "Unrecognized
        # named-value: secrets"）。看文件名是零副作用地判断签名状态的办法。
        run: |
          set -euo pipefail
          # 每次发布是四个产物同一个版本号，所以说明开头先把四个一起列出来 ——
          # 「线上这个镜像对应哪个 APK」应当一眼可答。镜像与站点的成败取自
          # needs.*.result，不猜。
          mark() { case "$1" in success) echo '✅';; skipped) echo '⏭️ 跳过';; *) echo "❌ $1";; esac; }
          {
            echo "# Explore Journal ${TAG}"
            echo
            echo "版本号取自 \`CHANGELOG.md\`，本次发布的四个产物同号（\`${VERSION}\`）。"
            echo
            echo "| 产物 | 标识 | 状态 |"
            echo "|---|---|---|"
            echo "| Docker 镜像 | \`ghcr.io/${GITHUB_REPOSITORY}/app:${TAG}\` | $(mark "$IMAGE_RESULT") |"
            echo "| 公开站点 | \`web-build\` 分支 | $(mark "$SITE_RESULT") |"
            echo "| Android APK | 见下 | $(ls artifacts/*.apk >/dev/null 2>&1 && echo '✅' || echo '❌') |"
            echo "| iOS IPA | 见下 | $(ls artifacts/*.ipa >/dev/null 2>&1 && echo '✅' || echo '❌') |"
            echo

            if ls artifacts/explore_journal-*-android-universal.apk >/dev/null 2>&1; then
              echo "## Android"
              for f in artifacts/explore_journal-*-android-universal.apk; do
                bn=$(basename "$f")
                echo "- \`$bn\` — universal build, installs on every Android device (armv7 / arm64 / x86_64 all included)"
              done
              echo
              echo "_Signing: your own upload key if you set \`ANDROID_KEYSTORE_BASE64\`, otherwise the committed stable sideload key — either way every build signs identically, so 覆盖安装（in-place upgrade）works._"
              echo
              echo "> **覆盖安装：** 现在所有 CI / 本地 release 包都用同一个固定密钥签名，可以直接覆盖升级、无需卸载。**仅有一次例外**：如果你机器上还装着本次改动之前的旧包（用的是临时 debug 密钥），那一次需要先卸载旧版再装新版；之后历次升级都不用再卸载了。"
              echo
            fi

            if ls artifacts/explore_journal-*-ios*.ipa >/dev/null 2>&1; then
              echo "## iOS"
              for f in artifacts/explore_journal-*-ios*.ipa; do
                bn=$(basename "$f")
                echo "- \`$bn\`"
              done
              echo
              if ls artifacts/explore_journal-*-ios-unsigned.ipa >/dev/null 2>&1; then
                echo "_Unsigned build — install via AltStore / Sideloadly / TrollStore. NOT submittable to App Store as-is._"
              else
                echo "_Production-signed build. Check ExportOptions for the method (development / ad-hoc / app-store)._"
              fi
              echo
            fi

            echo "---"
            echo
            echo "Built from \`${SHA}\` on the Flutter SDK pinned in \`.github/actions/flutter-setup\`."
            echo "See \`docs/publishing.md\` for store-submission guidance."
          } > /tmp/notes.md
          cat /tmp/notes.md

      - name: "覆盖模式：把 tag 移到当前 commit"
        # action-gh-release 遇到已存在的 tag 只更新 Release，**不会移动 tag** ——
        # 那样资产是新的、tag 还指着旧 commit，对不上。
        if: needs.version.outputs.overwrite == 'true'
        env:
          VTAG: ${{ needs.version.outputs.tag }}
        run: |
          set -euo pipefail
          git tag -f "${VTAG}" "${GITHUB_SHA}"
          git push -f origin "refs/tags/${VTAG}"
          echo "已把 ${VTAG} 移到 ${GITHUB_SHA}"

      - name: Create / update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: ${{ needs.version.outputs.tag }}
          body_path: /tmp/notes.md
          # -pre.N 一律算预发布：重跑一次发布不该把 latest / 正式版标记抢走。
          prerelease: ${{ needs.version.outputs.prerelease == 'true' || github.event.inputs.prerelease == 'true' }}
          # 追加资产：同一个 tag 重跑时不会因为文件已存在而失败。
          fail_on_unmatched_files: false
          files: |
            artifacts/*.apk
            artifacts/*.ipa
