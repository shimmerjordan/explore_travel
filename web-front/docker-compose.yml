services:
  web-front:
    build: .
    image: web-front:latest
    container_name: web-front
    restart: unless-stopped
    # High host port (left side) — change it freely if 48080 is taken on your NAS,
    # but NEVER to 80 / 443 / 8080: consumer ISPs block inbound traffic on those,
    # so a home/NAS deployment becomes unreachable from the internet. Sibling
    # service uses the adjacent high port 48081. There is no separate static-web
    # service any more: this image serves the Flutter web build itself.
    ports:
      - "48080:48080"
    volumes:
      # WHERE THE DATA LIVES — one variable, two modes. Holds admin.json (and,
      # from Task 8 onward, the encrypted config blob).
      #
      #   unset (default) → resolves to `ejdata`, a Docker NAMED volume.
      #     Zero host setup: a named volume inherits the image's nonroot-owned
      #     /data, so it's writable out of the box.
      #
      #   set to an absolute path → bind mount, data sits in your own directory
      #     (the usual choice on a NAS, so it lands on the big disk and gets
      #     picked up by the NAS's own backup jobs):
      #
      #       EJ_DATA_PATH=/volume1/docker/web-front/data
      #
      #     A bind mount does NOT inherit image ownership, so grant the
      #     container's nonroot UID access ONCE before the first start:
      #       sudo mkdir -p /volume1/docker/web-front/data
      #       sudo chown -R 65532:65532 /volume1/docker/web-front/data
      #
      # Local filesystem only — never point this at NFS/SMB: unreliable POSIX
      # locking on network mounts risks corrupting the on-disk files.
      - "${EJ_DATA_PATH:-ejdata}:/data"
    environment:
      EJ_LISTEN: "0.0.0.0:48080"
      EJ_DATA_DIR: "/data"
      # Read proxy for private images / CORS-less hosts (off by default).
      EJ_PROXY_ENABLED: "${EJ_PROXY_ENABLED:-false}"
      EJ_PROXY_ALLOW_HOSTS: "${EJ_PROXY_ALLOW_HOSTS:-}"
      EJ_TOKEN_TTL_SECS: "${EJ_TOKEN_TTL_SECS:-3600}"

volumes:
  # Only used in the default (named-volume) mode; ignored when EJ_DATA_PATH
  # points at a host directory. Its real name is prefixed with the compose
  # project — `web-front_ejdata` when you run from this directory. Back it up:
  #   docker run --rm -v web-front_ejdata:/data -v "$PWD":/backup busybox \
  #     tar czf /backup/ejdata.tgz -C /data .
  ejdata:
