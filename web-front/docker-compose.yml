# ⚠️ 已被根目录的合并镜像取代（2026-09-05）。
# 现在 web-front 与 ej-backend 跑在**同一个容器**里（根 Dockerfile +
# deploy/supervisord.conf），部署用仓库根的 docker-compose.yml /
# docker-compose.ghcr.yml。对外端口没变（48080 / 48081）。
#
# 这个文件保留下来只为两件事：① 回退——合并镜像出问题时还能起回两个独立容器；
# ② 单独调试其中一个服务。日常部署别用它，两边同时起会抢端口。
#
services:
  web-front:
    build: .
    image: web-front:latest
    container_name: web-front
    restart: unless-stopped
    # High host port (left side) — change it freely if 48080 is taken on your NAS,
    # but NEVER to 80 / 443 / 8080: consumer ISPs block inbound traffic on those,
    # so a home/NAS deployment becomes unreachable from the internet. Sibling
    # service uses the adjacent high port 48081. There is no separate static-web
    # service any more: this image serves the Flutter web build itself.
    ports:
      - "48080:48080"
    volumes:
      # WHERE THE DATA LIVES — holds admin.json (the Argon2 password hash and
      # derivation salt), the encrypted user config, and the metrics file. Three
      # small files, well under 1 MB in total.
      #
      # DEFAULT — the Docker-managed named volume declared at the bottom of this
      # file. Nothing outside the container is touched: no host directory to
      # create, no ownership to fix (a named volume inherits the image's
      # nonroot-owned /data). `pull` + `up -d` replaces the container and keeps
      # the volume, so an upgrade never loses the password or the config.
      #   ⚠ `docker compose down -v` DELETES the volume — and with it the admin
      #     password and every stored cloud credential. Stop with plain `down`.
      #
      # This file builds from source and is meant for local development, hence
      # the named-volume default: it keeps the data off your dev machine's
      # filesystem. The NAS deployment file (docker-compose.ghcr.yml) defaults
      # the other way — a host directory, `/share/Web/ej_data/front`.
      #
      # OPTIONAL — set EJ_DATA_PATH to an absolute path to keep the data in a
      # directory of your own instead (e.g. so the NAS's own backup job sees it):
      #   EJ_DATA_PATH=/share/Web/ej_data/front
      # A bind mount does NOT inherit image ownership, so grant the container's
      # nonroot UID access ONCE before the first start:
      #   sudo mkdir -p /share/Web/ej_data/front
      #   sudo chown -R 65532:65532 /share/Web/ej_data/front
      # Local filesystem only — never point this at NFS/SMB: unreliable POSIX
      # locking on network mounts risks corrupting the on-disk files.
      - "${EJ_DATA_PATH:-ej-web-front-data}:/data"
    environment:
      EJ_LISTEN: "0.0.0.0:48080"
      EJ_DATA_DIR: "/data"
      # Read proxy for private images / CORS-less hosts (off by default).
      EJ_PROXY_ENABLED: "${EJ_PROXY_ENABLED:-false}"
      EJ_PROXY_ALLOW_HOSTS: "${EJ_PROXY_ALLOW_HOSTS:-}"
      EJ_TOKEN_TTL_SECS: "${EJ_TOKEN_TTL_SECS:-3600}"
      # 经 frp / Cloudflare / 任何反代暴露时**必须**设为 1，否则所有访客共享
      # 同一个限流桶（限流是按客户端 IP 分桶的，不开这个的话看到的 IP 永远是
      # 反代自己）。直接暴露端口时保持 0。
      EJ_TRUST_PROXY: "${EJ_TRUST_PROXY:-0}"
      # 静态产物目录。镜像里已经带了一份 web 产物；挂一个同名目录可以覆盖它
      # （例如临时换一个前端版本而不重建镜像）。
      EJ_WEB_ROOT: "${EJ_WEB_ROOT:-/web}"
      # 指标采样间隔（秒，上限 86400）。落盘是每 10 个采样点一次，所以调小它
      # 会让机械盘更频繁地转。
      EJ_METRICS_INTERVAL_SECS: "${EJ_METRICS_INTERVAL_SECS:-60}"
      # 工作线程数。服务是 thread-per-request 的，见 README 的威胁模型一节：
      # 无论调多大都要置于带读写超时的反代之后。
      EJ_WORKERS: "${EJ_WORKERS:-8}"

volumes:
  # Used unless EJ_DATA_PATH points at a host directory.
  ej-web-front-data:
    # The explicit `name:` is what makes "recreate without losing data" true.
    # Without it the real volume name carries the compose project prefix (the
    # directory name by default, or the application name under QNAP Container
    # Station / Synology Container Manager), so bringing the stack up from a
    # differently named directory or re-creating the application silently mounts
    # a FRESH EMPTY volume — the service then looks wiped while the old volume
    # sits there unmounted. Back it up any time with:
    #   docker run --rm -v ej-web-front-data:/data -v "$PWD":/backup busybox \
    #     tar czf /backup/web-front-data.tgz -C /data .
    # Coming from a deployment made before 2026-07-30 (volume was
    # `<project>_ejdata`), copy the old contents over once:
    #   docker run --rm -v web-front_ejdata:/from -v ej-web-front-data:/to \
    #     busybox sh -c 'cd /from && cp -a . /to'
    name: ej-web-front-data
