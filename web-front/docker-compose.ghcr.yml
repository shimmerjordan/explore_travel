# ⚠️ 已被根目录的合并镜像取代（2026-09-05）。
# 现在 web-front 与 ej-backend 跑在**同一个容器**里（根 Dockerfile +
# deploy/supervisord.conf），部署用仓库根的 docker-compose.yml /
# docker-compose.ghcr.yml。对外端口没变（48080 / 48081）。
#
# 这个文件保留下来只为两件事：① 回退——合并镜像出问题时还能起回两个独立容器；
# ② 单独调试其中一个服务。日常部署别用它，两边同时起会抢端口。
#
# web-front — deploy from the prebuilt GHCR image (no source checkout, no build).
#
# This is the file the CI run summary hands you for a NAS deployment. It is
# deliberately self-contained: `docker compose up -d` next to a .env is all it
# needs. For building from source instead, use docker-compose.yml.
#
# .env next to this file (the summary generates it for you):
#   EJ_DATA_PATH=/volume1/docker/web-front/data      where admin.json lives (see below)

services:
  web-front:
    # Multi-arch manifest (amd64 + arm64) — docker picks the right one.
    # Pin to a commit sha instead of `latest` if you want reproducible rollouts:
    #   image: ghcr.io/shimmerjordan/explore_travel/web-front:sha-1a2b3c4
    image: ${EJ_WEB_FRONT_IMAGE:-ghcr.io/shimmerjordan/explore_travel/web-front:latest}
    container_name: web-front
    restart: unless-stopped
    # High host port. NEVER use 80 / 443 / 8080: consumer ISPs block inbound
    # traffic on those, which makes a home/NAS deployment unreachable from the
    # internet. Sibling: ej-backend on 48081. (There is no separate static-web service any more — this image serves the web build itself.)
    ports:
      - "${EJ_PORT:-48080}:48080"
    volumes:
      # WHERE THE DATA LIVES — holds admin.json (the Argon2 password hash and
      # derivation salt), the encrypted user config, and the metrics file.
      #   unset (default) → `ejdata`, a Docker named volume; zero host setup.
      #   absolute path   → bind mount; the usual NAS choice, so the data lands
      #                     on the big disk and the NAS's own backup job sees it.
      #                     Grant the container's nonroot UID access ONCE first:
      #                       sudo mkdir -p <path> && sudo chown -R 65532:65532 <path>
      # Local filesystem only — never NFS/SMB: unreliable POSIX locking on
      # network mounts risks corrupting the on-disk files.
      - "${EJ_DATA_PATH:-ejdata}:/data"
    environment:
      EJ_LISTEN: "0.0.0.0:48080"
      EJ_DATA_DIR: "/data"
      EJ_PROXY_ENABLED: "${EJ_PROXY_ENABLED:-false}"
      EJ_PROXY_ALLOW_HOSTS: "${EJ_PROXY_ALLOW_HOSTS:-}"
      EJ_TOKEN_TTL_SECS: "${EJ_TOKEN_TTL_SECS:-3600}"
      # 经 frp / Cloudflare / 任何反代暴露时**必须**设为 1，否则所有访客共享
      # 同一个限流桶（限流是按客户端 IP 分桶的，不开这个的话看到的 IP 永远是
      # 反代自己）。直接暴露端口时保持 0。
      EJ_TRUST_PROXY: "${EJ_TRUST_PROXY:-0}"
      # 静态产物目录。镜像里已经带了一份 web 产物；挂一个同名目录可以覆盖它
      # （例如临时换一个前端版本而不重建镜像）。
      EJ_WEB_ROOT: "${EJ_WEB_ROOT:-/web}"
      # 指标采样间隔（秒，上限 86400）。落盘是每 10 个采样点一次，所以调小它
      # 会让机械盘更频繁地转。
      EJ_METRICS_INTERVAL_SECS: "${EJ_METRICS_INTERVAL_SECS:-60}"
      # 工作线程数。服务是 thread-per-request 的，见 README 的威胁模型一节：
      # 无论调多大都要置于带读写超时的反代之后。
      EJ_WORKERS: "${EJ_WORKERS:-8}"
    # No healthcheck: the image is distroless (no shell, no wget/curl) and the
    # binary has no self-probe subcommand. Check it from the host instead:
    #   curl localhost:48080/healthz   → {"status":"ok"}
    mem_limit: 256m
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "3" }

volumes:
  # Only used when EJ_DATA_PATH is unset. Real name is prefixed with the
  # compose project (the directory name). Back it up with:
  #   docker run --rm -v <project>_ejdata:/data -v "$PWD":/backup busybox \
  #     tar czf /backup/ejdata.tgz -C /data .
  ejdata:
